<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore Modello 3D Squalo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>

    <!-- Import Map per caricare Three.js ed i moduli Loader -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>
<body>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

        // 1. Scena, Camera e Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a192f); // Sfondo blu ambiente marino

        const camera = new THREE.PerspectiveCamera(
            45, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(0, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Controllo della telecamera con il mouse
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Illuminazione Ambiente e Direzionale
        const ambientLight = new THREE.AmbientLight(0xdff0ff, 1.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(5, 12, 7);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x0055ff, 1.0);
        fillLight.position.set(-5, -5, -5);
        scene.add(fillLight);

        // 3. Caricamento Mappe di Texture
        const textureLoader = new THREE.TextureLoader();
        const baseColorMap = textureLoader.load('gltf_embedded_0.jpg');
        const normalMap = textureLoader.load('gltf_embedded_1.png');
        const roughnessMap = textureLoader.load('gltf_embedded_2.jpg');
        const metallicMap = textureLoader.load('gltf_embedded_3@channels=R.jpg');

        baseColorMap.colorSpace = THREE.SRGBColorSpace;

        // 4. Mixer per Animazioni e Clock
        let mixer = null;
        const clock = new THREE.Clock();

        // 5. Caricamento Modello GLTF e Assegnazione Materiale PBR
        const loader = new GLTFLoader();
        loader.load(
            'shark_model.gltf',
            (gltf) => {
                const shark = gltf.scene;

                // Assegnazione delle mappe al materiale della Mesh
                shark.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            map: baseColorMap,
                            normalMap: normalMap,
                            roughnessMap: roughnessMap,
                            metalnessMap: metallicMap,
                            roughness: 0.35,
                            metalness: 0.15
                        });
                    }
                });

                // Posizionamento e ridimensionamento
                shark.position.set(0, 0, 0);
                shark.scale.set(1, 1, 1);
                scene.add(shark);

                // Riproduzione Animazione ('swimming', 'circling', o 'bite')
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(shark);
                    
                    // Cerca prima l'animazione di nuoto
                    const swimClip = THREE.AnimationClip.findByName(gltf.animations, 'swimming') || gltf.animations[0];
                    if (swimClip) {
                        const action = mixer.clipAction(swimClip);
                        action.play();
                    }
                }
            },
            (progress) => {
                if (progress.total > 0) {
                    console.log(`Caricamento: ${(progress.loaded / progress.total * 100).toFixed(1)}%`);
                }
            },
            (error) => {
                console.error('Errore durante il caricamento del file gltf:', error);
            }
        );

        // 6. Ridimensionamento della schermata integrato
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Loop di Rendering per aggiornare fotogrammi e animazioni
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
