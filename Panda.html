<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MERCEDES HYPERDRIVE: URBAN EVASION</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0f0f14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 230, 255, 0.2);
        }
        canvas {
            background-color: #228B22;
            display: block;
        }
        /* Controlli Touch per Mobile */
        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            justify-content: space-between;
        }
        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #00e6ff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            touch-action: manipulation;
        }
        .btn:active {
            background: #00e6ff;
            color: black;
        }
        @media (max-width: 800px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<!-- Controlli virtuali per smartphone -->
<div id="mobile-controls">
    <button class="btn" id="btn-left">◄</button>
    <button class="btn" id="btn-up">▲</button>
    <button class="btn" id="btn-down">▼</button>
    <button class="btn" id="btn-right">►</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Dimensioni e Limiti
const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const ROAD_LEFT = 80;
const ROAD_RIGHT = 320;
const SPEED_THRESHOLD = 7.5;

// Stato Tastiera e Touch
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// Gestione Touch Mobile
function setupTouch(id, code) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[code] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[code] = false; });
}
setupTouch("btn-left", "ArrowLeft");
setupTouch("btn-right", "ArrowRight");
setupTouch("btn-up", "ArrowUp");
setupTouch("btn-down", "ArrowDown");

// Funzione Disegno Auto Stile Mercedes
function drawMercedesCar(x, y, width, height, color, isPlayer = false) {
    ctx.save();

    // Ombra carrozzeria
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    ctx.beginPath();
    ctx.roundRect(x - 2, y - 2, width + 4, height + 4, 8);
    ctx.fill();

    // Corpo Principale
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, 8);
    ctx.fill();

    // Profilo Cromato
    ctx.strokeStyle = "#d2d2d7";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Parabrezza
    ctx.fillStyle = isPlayer ? "#78d2ff" : "#323741";
    ctx.beginPath();
    ctx.roundRect(x + 4, y + height * 0.25, width - 8, height * 0.35, 4);
    ctx.fill();
    ctx.strokeStyle = "#b4b4b4";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Griglia Mercedes e Stemma
    const gridY = isPlayer ? y + height - 6 : y + 2;
    ctx.fillStyle = "#dc8d8";
    ctx.beginPath();
    ctx.roundRect(x + 5, gridY, width - 10, 4, 1);
    ctx.fill();

    // Stella Mercedes (Centro Griglia)
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(x + width / 2, gridY + 2, 2, 0, Math.PI * 2);
    ctx.fill();

    // Fari
    const headlight = "#ffffdc";
    const taillight = "#ff1414";

    if (isPlayer) {
        ctx.fillStyle = headlight;
        ctx.fillRect(x + 2, y + 1, 6, 3);
        ctx.fillRect(x + width - 8, y + 1, 6, 3);
        ctx.fillStyle = taillight;
        ctx.fillRect(x + 3, y + height - 4, 6, 2);
        ctx.fillRect(x + width - 9, y + height - 4, 6, 2);
    } else {
        ctx.fillStyle = headlight;
        ctx.fillRect(x + 2, y + height - 4, 6, 3);
        ctx.fillRect(x + width - 8, y + height - 4, 6, 3);
        ctx.fillStyle = taillight;
        ctx.fillRect(x + 3, y + 1, 6, 2);
        ctx.fillRect(x + width - 9, y + 1, 6, 2);
    }

    ctx.restore();
}

// Giocatore
class Player {
    constructor() {
        this.width = 30;
        this.height = 55;
        this.x = WIDTH / 2 - this.width / 2;
        this.y = HEIGHT - 90;
        this.speed = 5.0;
        this.color = "#19191c";
    }

    move() {
        if ((keys["ArrowLeft"] || keys["KeyA"]) && this.x > ROAD_LEFT + 5) {
            this.x -= 4.5;
        }
        if ((keys["ArrowRight"] || keys["KeyD"]) && this.x < ROAD_RIGHT - this.width - 5) {
            this.x += 4.5;
        }
        if (keys["ArrowUp"] || keys["KeyW"]) {
            this.speed = Math.min(this.speed + 0.08, 12.0);
        } else if (keys["ArrowDown"] || keys["KeyS"]) {
            this.speed = Math.max(this.speed - 0.12, 2.0);
        } else {
            if (this.speed > 5.0) this.speed -= 0.04;
            else if (this.speed < 5.0) this.speed += 0.04;
        }
    }

    draw() {
        drawMercedesCar(this.x, this.y, this.width, this.height, this.color, true);
    }
}

// Auto Nemiche
class EnemyCar {
    constructor() {
        this.width = 30;
        this.height = 55;
        const lanes = [95, 155, 215, 275];
        this.x = lanes[Math.floor(Math.random() * lanes.length)];
        this.y = -70;
        this.baseSpeed = 3.0 + Math.random() * 1.5;
        
        const colors = ["#c3c8cd", "#f5f5fa", "#142341", "#4b0a14"];
        this.color = colors[Math.floor(Math.random() * colors.length)];
    }

    update(playerSpeed) {
        this.y += this.baseSpeed + (playerSpeed - 5.0);
    }

    draw() {
        drawMercedesCar(this.x, this.y, this.width, this.height, this.color, false);
    }
}

// Particelle per Esplosione
class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.radius = Math.random() * 8 + 4;
        const colors = ["#dc143c", "#ff8c00", "#ffd700"];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.life = 30;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0, this.radius), 0, Math.PI * 2);
        ctx.fill();
    }
}

// Stato del Gioco
let player = new Player();
let enemies = [];
let particles = [];
let roadOffset = 0;
let spawnTimer = 0;
let gameState = "INTRO"; // INTRO, PLAYING, GAMEOVER
let exploded = false;

function resetGame() {
    player = new Player();
    enemies = [];
    particles = [];
    roadOffset = 0;
    spawnTimer = 0;
    exploded = false;
    gameState = "PLAYING";
}

// Loop Principale
function gameLoop() {
    // Sfondo e Erba
    ctx.fillStyle = "#146423";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    if (gameState === "INTRO") {
        // Schermata Iniziale
        ctx.fillStyle = "#0f0f14";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.fillStyle = "#00e6ff";
        ctx.fillRect(20, 100, WIDTH - 40, 3);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "center";
        ctx.fillText("MERCEDES HYPERDRIVE", WIDTH / 2, 130);

        ctx.fillStyle = "#00e6ff";
        ctx.font = "bold 18px Arial";
        ctx.fillText("URBAN EVASION", WIDTH / 2, 160);

        ctx.fillStyle = "#ffffff";
        ctx.font = "13px Arial";
        ctx.fillText("• Frecce SU/GIÙ: Accelera / Frena", WIDTH / 2, 230);
        ctx.fillText("• Frecce SX/DX: Sterza", WIDTH / 2, 260);
        
        ctx.fillStyle = "#78ff78";
        ctx.fillText("• A bassa velocità eviti l'incidente!", WIDTH / 2, 300);
        
        ctx.fillStyle = "#ff4d4d";
        ctx.fillText("• Ad alta velocità l'impatto esplode!", WIDTH / 2, 330);

        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 14px Arial";
        ctx.fillText("PREMI 'SPAZIO' O TOCCA PER INIZIARE", WIDTH / 2, 420);

        if (keys["Space"] || keys["Enter"]) resetGame();
        canvas.onclick = () => { if (gameState === "INTRO") resetGame(); };

    } else if (gameState === "PLAYING" || gameState === "GAMEOVER") {

        if (gameState === "PLAYING") {
            player.move();
            roadOffset = (roadOffset + player.speed) % 30;

            spawnTimer++;
            if (spawnTimer > 45) {
                enemies.push(new EnemyCar());
                spawnTimer = 0;
            }

            // Gestione Collisioni e Movimento
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.update(player.speed);

                if (e.y > HEIGHT + 80) {
                    enemies.splice(i, 1);
                    continue;
                }

                // Controllo rettangoli per collisione
                if (player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y) {

                    if (player.speed > SPEED_THRESHOLD) {
                        // ALTA VELOCITÀ: Esplosione
                        gameState = "GAMEOVER";
                        exploded = true;
                        for (let k = 0; k < 40; k++) {
                            particles.push(new Particle(player.x + player.width / 2, player.y + player.height / 2));
                        }
                    } else {
                        // BASSA VELOCITÀ: Separazione fisica senza incidente
                        if (player.x < e.x) player.x = e.x - player.width - 3;
                        else player.x = e.x + e.width + 3;

                        player.x = Math.max(ROAD_LEFT + 5, Math.min(player.x, ROAD_RIGHT - player.width - 5));
                        player.speed = Math.max(2.0, player.speed - 0.4);
                    }
                }
            }
        }

        // --- DISEGNO PISTA ---
        ctx.fillStyle = "#232326";
        ctx.fillRect(ROAD_LEFT, 0, ROAD_RIGHT - ROAD_LEFT, HEIGHT);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(ROAD_LEFT - 4, 0, 8, HEIGHT);
        ctx.fillRect(ROAD_RIGHT - 4, 0, 8, HEIGHT);

        // Strisce mezzeria
        ctx.fillStyle = "#ffd700";
        for (let y = -30; y < HEIGHT; y += 30) {
            ctx.fillRect(158, y + roadOffset, 4, 15);
            ctx.fillRect(238, y + roadOffset, 4, 15);
        }

        // Disegno Nemici
        enemies.forEach(e => e.draw());

        // Disegno Giocatore o Esplosione
        if (!exploded) {
            player.draw();
        } else {
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });
        }

        // HUD / Velocità
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "left";
        ctx.fillText(`Velocità: ${Math.floor(player.speed * 15)} km/h`, 10, 25);

        if (player.speed > SPEED_THRESHOLD) {
            ctx.fillStyle = "#ff4d4d";
            ctx.fillText("PERICOLO ESPLOSIONE!", 10, 45);
        } else {
            ctx.fillStyle = "#78ff78";
            ctx.fillText("Velocità Sicura", 10, 45);
        }

        // Game Over
        if (gameState === "GAMEOVER") {
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            ctx.fillStyle = "#ff1414";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.fillText("IMPATTO AD ALTA VELOCITÀ!", WIDTH / 2, HEIGHT / 2 - 20);

            ctx.fillStyle = "#ffffff";
            ctx.font = "14px Arial";
            ctx.fillText("Premi 'R' o Tocca per Ripartire", WIDTH / 2, HEIGHT / 2 + 20);

            if (keys["KeyR"]) resetGame();
            canvas.onclick = () => { if (gameState === "GAMEOVER") resetGame(); };
        }
    }

    requestAnimationFrame(gameLoop);
}

// Avvio Loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
