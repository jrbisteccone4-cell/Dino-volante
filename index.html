<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Game - Backrooms</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #2b261d; font-family: sans-serif; position: fixed; }
        canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 1; }

        #menu-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 88888;
        }
        
        .menu-title { font-size: 28px; font-weight: bold; color: #00ffcc; margin-bottom: 30px; font-family: monospace; letter-spacing: 2px; text-align: center; padding: 0 20px;}
        .menu-btn {
            width: 200px; padding: 15px; margin: 10px; background: #111; border: 2px solid #00ffcc;
            color: #00ffcc; font-size: 16px; font-weight: bold; font-family: monospace;
            border-radius: 8px; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,255,204,0.2);
        }
        .menu-btn:active { transform: scale(0.95); background: #00ffcc; color: #111; }

        #hud {
            position: absolute; top: 80px; left: 15px; color: #222; font-size: 13px; font-weight: bold;
            font-family: monospace; pointer-events: none; z-index: 10; background: rgba(255,255,255,0.9);
            padding: 8px 12px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: none;
        }

        #status-log {
            position: absolute; top: 130px; left: 15px; color: #00ffcc; font-size: 12px;
            font-family: monospace; pointer-events: none; z-index: 10; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 4px; max-width: 90vw; display: none;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 20px; width: 120px; height: 120px;
            background: rgba(0, 0, 0, 0.35); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; touch-action: none; z-index: 10; display: none;
        }
        #joystick-knob {
            position: absolute; top: 37px; left: 37px; width: 46px; height: 46px;
            background: #222; border: 2px solid #fff; border-radius: 50%; pointer-events: none;
        }

        #btn-jump {
            position: absolute; bottom: 30px; right: 20px; width: 68px; height: 68px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6); color: white; font-weight: bold; font-size: 12px;
            display: none; align-items: center; justify-content: center; touch-action: none;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); background: #ff9900; cursor: pointer;
        }
        #btn-jump:active { transform: scale(0.9); }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div class="menu-title" id="menu-title-text">MAP: 0%</div>
        <div class="menu-btn" id="btn-start" style="display: none;">START</div>
        <div class="menu-btn" id="btn-exit" style="display: none;">EXIT</div>
    </div>

    <div id="hud">
        STATO: <span id="status-text">PRONTO</span><br>
        POS: X:<span id="posX">8.0</span> Y:<span id="posY">0</span> Z:<span id="posZ">0</span>
    </div>
    <div id="status-log">Inizializzazione...</div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-jump">SALTA</div>

    <script>
        function log(msg, isError = false) { 
            console.log(msg);
            const logEl = document.getElementById('status-log');
            logEl.style.color = isError ? "#ff4444" : "#00ffcc";
            logEl.innerText = msg; 
        }

        let scene, camera, renderer, mapMesh;
        let clock = new THREE.Clock();
        let moveInput = { x: 0, y: 0 };
        let playerPos = new THREE.Vector3(8.0, 0, 0);
        let playerVelocityY = 0;
        let isGrounded = true;
        let cameraYaw = 0;
        let cameraPitch = 0;
        let isMapLoaded = false;

        let singleRat = null;

        const raycaster = new THREE.Raycaster();
        let collidableObjects = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2b261d); 
            scene.fog = new THREE.FogExp2(0x2b261d, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.position.set(10, 30, 10);
            scene.add(mainLight);

            loadMap();
            setupMenu();
            setupControls();

            animate();
        }

        function createFullPerimeterWalls() {
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xf0d050, 
                roughness: 0.85 
            });

            const wallHeight = 30;
            const minX = -44.1;
            const maxX = 48.7;
            const minZ = -50.0;
            const maxZ = 188.3;

            const widthX = maxX - minX;
            const depthZ = maxZ - minZ;
            const centerX = (maxX + minX) / 2;
            const centerZ = (maxZ + minZ) / 2;

            const northWall = new THREE.Mesh(new THREE.BoxGeometry(widthX, wallHeight, 2), wallMaterial);
            northWall.position.set(centerX, wallHeight / 2, minZ);
            scene.add(northWall);
            collidableObjects.push(northWall);

            const southWall = new THREE.Mesh(new THREE.BoxGeometry(widthX, wallHeight, 2), wallMaterial);
            southWall.position.set(centerX, wallHeight / 2, maxZ);
            scene.add(southWall);
            collidableObjects.push(southWall);

            const westWall = new THREE.Mesh(new THREE.BoxGeometry(2, wallHeight, depthZ), wallMaterial);
            westWall.position.set(minX, wallHeight / 2, centerZ);
            scene.add(westWall);
            collidableObjects.push(westWall);

            const eastWall = new THREE.Mesh(new THREE.BoxGeometry(2, wallHeight, depthZ), wallMaterial);
            eastWall.position.set(maxX, wallHeight / 2, centerZ);
            scene.add(eastWall);
            collidableObjects.push(eastWall);
        }

        function loadSingleRat() {
            log("Caricamento del topo vicino a te...");
            const loader = new THREE.GLTFLoader();
            
            loader.load('topo.glb', (gltf) => {
                singleRat = gltf.scene;
                
                singleRat.scale.set(0.15, 0.15, 0.15);
                // SPAWN VICINO AL GIOCATORE (Player parte a X: 8.0, Z: 0. Lo mettiamo a Z: -1.0, proprio davanti)
                singleRat.position.set(8.0, 0, -1.0);

                singleRat.userData = {
                    speed: 1.5,
                    direction: new THREE.Vector3(1, 0, 0).normalize()
                };

                singleRat.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.side = THREE.DoubleSide;
                    }
                });

                scene.add(singleRat);
                log("Topo spawnato davanti a te e in movimento!", false);
            }, undefined, (error) => {
                console.error(error);
                log("ERRORE: Impossibile trovare 'topo.glb'", true);
            });
        }

        function loadMap() {
            log("Caricamento mappa.glb...");
            const loader = new THREE.GLTFLoader();

            loader.load('mappa.glb', (gltf) => {
                mapMesh = gltf.scene;
                collidableObjects = [];
                scene.add(mapMesh);

                mapMesh.traverse((child) => {
                    if (child.isMesh) {
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                        }
                        collidableObjects.push(child);
                    }
                });

                createFullPerimeterWalls();
                loadSingleRat();

                playerPos.set(8.0, 0, 0); 
                isMapLoaded = true; 
                
                document.getElementById('menu-title-text').innerText = "BACKROOMS 3D";
                document.getElementById('btn-start').style.display = 'block';
                document.getElementById('btn-exit').style.display = 'block';

            }, (xhr) => {
                if (xhr.total) {
                    const pct = Math.floor((xhr.loaded / xhr.total) * 100);
                    document.getElementById('menu-title-text').innerText = `MAP: ${pct}%`;
                }
            }, (error) => {
                log("ERRORE: Impossibile caricare 'mappa.glb'", true);
                console.error(error);
            });
        }

        function setupMenu() {
            document.getElementById('btn-start').addEventListener('click', () => {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('status-log').style.display = 'block';
                document.getElementById('joystick-container').style.display = 'block';
                document.getElementById('btn-jump').style.display = 'flex';
            });

            document.getElementById('btn-exit').addEventListener('click', () => {
                alert("Gioco chiuso o ricaricabile.");
            });
        }

        function setupControls() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let joystickTouchId = null;
            let cameraTouchId = null;
            let joystickCenter = { x: 0, y: 0 };
            let lastTouchPos = { x: 0, y: 0 };

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const rect = container.getBoundingClientRect();

                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        if (joystickTouchId === null) {
                            joystickTouchId = touch.identifier;
                            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                            updateJoystick(touch);
                        }
                    } else if (touch.clientX > window.innerWidth / 3 && cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];

                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === cameraTouchId) {
                        const dx = touch.clientX - lastTouchPos.x;
                        const dy = touch.clientY - lastTouchPos.y;

                        cameraYaw -= dx * 0.004;
                        cameraPitch = Math.max(-0.6, Math.min(0.6, cameraPitch + dy * 0.004));

                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            const stopTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        moveInput = { x: 0, y: 0 };
                    }
                    if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', stopTouch);
            window.addEventListener('touchcancel', stopTouch);

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                
                moveInput.x = (dx / maxDist);
                moveInput.y = (dy / maxDist);
            }

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGrounded) {
                    playerVelocityY = 4.5;
                    isGrounded = false;
                }
            }, { passive: false });
        }

        function canMoveTo(targetPos) {
            if (collidableObjects.length === 0) return true;
            const origin = targetPos.clone();
            origin.y += 0.4;
            const directions = [
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-1, 0, 0),
                new THREE.Vector3(0, 0, 1),
                new THREE.Vector3(0, 0, -1)
            ];
            for (let dir of directions) {
                raycaster.set(origin, dir);
                const hits = raycaster.intersectObjects(collidableObjects, true);
                if (hits.length > 0 && hits[0].distance < 0.3) return false;
            }
            return true;
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const inputMag = Math.hypot(moveInput.x, moveInput.y);
            
            if (isMapLoaded) {
                if (inputMag > 0.05) {
                    const currentSpeed = 2.0 * inputMag * delta;
                    const moveAngle = Math.atan2(-moveInput.x, -moveInput.y) + cameraYaw;

                    const moveDir = new THREE.Vector3(
                        Math.sin(moveAngle) * currentSpeed,
                        0,
                        Math.cos(moveAngle) * currentSpeed
                    );

                    let nextX = playerPos.clone();
                    nextX.x += moveDir.x;
                    if (canMoveTo(nextX)) playerPos.x = nextX.x;

                    let nextZ = playerPos.clone();
                    nextZ.z += moveDir.z;
                    if (canMoveTo(nextZ)) playerPos.z = nextZ.z;
                }

                if (!isGrounded) {
                    playerPos.y += playerVelocityY * delta;
                    playerVelocityY -= 12.0 * delta;

                    if (playerPos.y <= 0) {
                        playerPos.y = 0;
                        playerVelocityY = 0;
                        isGrounded = true;
                    }
                }

                // MOVIMENTO DEL TOPO
                if (singleRat) {
                    singleRat.position.addScaledVector(singleRat.userData.direction, singleRat.userData.speed * delta);
                    
                    const targetLook = singleRat.position.clone().add(singleRat.userData.direction);
                    singleRat.lookAt(targetLook);

                    if (singleRat.position.x < -43.0 || singleRat.position.x > 47.5) {
                        singleRat.userData.direction.x *= -1;
                    }
                    if (singleRat.position.z < -49.0 || singleRat.position.z > 187.0) {
                        singleRat.userData.direction.z *= -1;
                    }

                    if (Math.random() < 0.02) {
                        singleRat.userData.direction.set(
                            Math.random() - 0.5,
                            0,
                            Math.random() - 0.5
                        ).normalize();
                    }
                }
            }

            camera.position.set(playerPos.x, playerPos.y + 0.8, playerPos.z);
            
            const lookTarget = new THREE.Vector3(
                playerPos.x + Math.sin(cameraYaw) * 5,
                playerPos.y + 0.8 - cameraPitch * 5,
                playerPos.z + Math.cos(cameraYaw) * 5
            );
            camera.lookAt(lookTarget);

            document.getElementById('posX').innerText = playerPos.x.toFixed(1);
            document.getElementById('posY').innerText = playerPos.y.toFixed(1);
            document.getElementById('posZ').innerText = playerPos.z.toFixed(1);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
