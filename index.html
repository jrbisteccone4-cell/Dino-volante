<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino Volante mobile</title>
  <style>
    body { margin: 0; overflow: hidden; background: #70c5ce; touch-action: none; font-family: sans-serif; }
    canvas { display: block; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.5); color: white; text-align: center;
    }
    button { padding: 15px 30px; font-size: 1.2rem; border: none; border-radius: 8px; background: #ff5722; color: white; }
  </style>
</head>
<body>

  <div id="overlay">
    <h1 id="title">Dino Volante 🦕</h1>
    <p>Inclina il telefono per girare<br>Tocca lo schermo per volare</p>
    <button id="startBtn">GIOCA</button>
  </div>
  
  <canvas id="canvas"></canvas>

<script>
// --- REGISTRO DEI 24 EVENTI / PASSAGGI LOGICI DEL GIOCO ---

// 1. Inizializzazione Canvas e contesto grafico
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

// 2. Ridimensionamento dinamico al display del telefono
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 3. Definizione dello stato del Giocatore (Dinosauro)
let dino = { x: 0, y: 0, vx: 0, vy: 0, size: 25 };

// 4. Definizione degli ostacoli (Nuvole/Rupi) e punteggio
let obstacles = [];
let score = 0;
let gameOver = false;
let gameRunning = false;

// 5. Configurazione della Fisica (Gravità e Spinta)
const gravity = 0.35;
const flapPower = -7.5;
let tiltX = 0;

// 6. Evento Touch: Ascolto pressione schermo (Flap / Volo)
window.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameRunning && !gameOver) {
    dino.vy = flapPower; // Evento 7: Applicazione spinta verso l'alto
  }
}, { passive: false });

// 8. Evento Gyroscope: Ascolto inclinazione del dispositivo (Tilt)
window.addEventListener('deviceorientation', (e) => {
  if (e.gamma !== null) {
    tiltX = e.gamma; // Evento 9: Calcolo dell'angolo di inclinazione sull'asse X
  }
});

// 10. Evento Start: Avvio della partita al tap sul pulsante
startBtn.addEventListener('click', () => {
  // Richiesta permessi sensori (necessario per iOS 13+)
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === 'granted') startGame();
      else startGame();
    }).catch(() => startGame());
  } else {
    startGame();
  }
});

// 11. Funzione Reset / Inizio Partita
function startGame() {
  dino.x = canvas.width / 2;
  dino.y = canvas.height / 2;
  dino.vx = 0;
  dino.vy = 0;
  obstacles = [];
  score = 0;
  gameOver = false;
  gameRunning = true;
  overlay.style.display = 'none';
  loop(); // Avvio ciclo principale
}

// 12. Generazione dinamica ostacoli
function spawnObstacle() {
  const gap = 170;
  const topHeight = Math.random() * (canvas.height - gap - 100) + 50;
  obstacles.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - gap,
    passed: false
  });
}

// 13. Ciclo Principale di Gioco (Game Loop)
let frameCount = 0;
function loop() {
  if (!gameRunning) return;

  // 14. Aggiornamento Fisica Verticale (Gravità)
  dino.vy += gravity;
  dino.y += dino.vy;

  // 15. Aggiornamento Fisica Orizzontale (Inclinazione sensore)
  dino.vx = tiltX * 0.4;
  dino.x += dino.vx;

  // 16. Limiti mappa (Keep in bounds)
  if (dino.x - dino.size < 0) dino.x = dino.size;
  if (dino.x + dino.size > canvas.width) dino.x = canvas.width - dino.size;

  // 17. Generazione cadenzata ostacoli
  frameCount++;
  if (frameCount % 90 === 0) spawnObstacle();

  // 18. Pulizia dello schermo
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 19. Rendering del Dinosauro Volante
  ctx.fillStyle = '#4CAF50';
  ctx.beginPath();
  ctx.arc(dino.x, dino.y, dino.size, 0, Math.PI * 2);
  ctx.fill();
  // Ala del dinosauro
  ctx.fillStyle = '#388E3C';
  ctx.fillRect(dino.x - 10, dino.y - 5, 12, 8);

  // 20. Rendering e movimento Ostacoli
  ctx.fillStyle = '#795548';
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= 3; // Velocità scorrimento

    // Disegna colonna superiore e inferiore
    ctx.fillRect(obs.x, 0, 50, obs.top);
    ctx.fillRect(obs.x, canvas.height - obs.bottom, 50, obs.bottom);

    // 21. Incremento Punteggio al superamento
    if (!obs.passed && obs.x < dino.x) {
      score++;
      obs.passed = true;
    }

    // 22. Rilevamento Collisioni (Hitbox)
    if (
      dino.x + dino.size > obs.x && dino.x - dino.size < obs.x + 50 &&
      (dino.y - dino.size < obs.top || dino.y + dino.size > canvas.height - obs.bottom)
    ) {
      triggerGameOver();
    }

    // Rimozione ostacoli fuori schermo
    if (obs.x < -50) obstacles.splice(i, 1);
  }

  // Controlla se cade in basso o vola troppo in alto
  if (dino.y + dino.size > canvas.height || dino.y - dino.size < 0) {
    triggerGameOver();
  }

  // 23. Disegno dell'Interfaccia Utente (Score)
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`Punti: ${score}`, 20, 40);

  if (!gameOver) {
    requestAnimationFrame(loop);
  }
}

// 24. Evento Game Over e gestione Schermata Finale
function triggerGameOver() {
  gameOver = true;
  gameRunning = false;
  document.getElementById('title').innerText = 'Game Over! 💥';
  startBtn.innerText = 'RIAPRI';
  overlay.style.display = 'flex';
}
</script>
</body>
</html>
