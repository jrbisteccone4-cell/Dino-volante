<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Shark Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010b14;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            touch-action: none;
            z-index: 10;
        }
        #joystick-knob {
            position: absolute;
            top: 32px;
            left: 32px;
            width: 45px;
            height: 45px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .btn-action {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-action:active {
            transform: scale(0.9);
        }
        #btn-bite {
            bottom: 30px;
            right: 30px;
            background: rgba(220, 53, 69, 0.85);
        }
        #btn-dash {
            bottom: 110px;
            right: 35px;
            background: rgba(255, 193, 7, 0.85);
            color: #000;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
            }
        }
    </script>
</head>
<body>

    <div id="hud">
        Punti: <span id="score">0</span> | Prede Divorate: <span id="eaten">0</span>
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div id="btn-dash" class="btn-action">SCATTO</div>
    <div id="btn-bite" class="btn-action">MORDI</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x011326);
        scene.fog = new THREE.FogExp2(0x011326, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xdff0ff, 2.0);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(30, 100, 30);
        scene.add(sunLight);

        const seabedGeo = new THREE.PlaneGeometry(600, 600, 32, 32);
        const seabedMat = new THREE.MeshStandardMaterial({ color: 0x0f2a1d, roughness: 0.9 });
        const seabed = new THREE.Mesh(seabedGeo, seabedMat);
        seabed.rotation.x = -Math.PI / 2;
        seabed.position.y = -30;
        scene.add(seabed);

        const sharkContainer = new THREE.Group();
        scene.add(sharkContainer);

        // MODELLO DI RISERVA VISIBILE SUBITO
        const bodyGeo = new THREE.ConeGeometry(1, 4, 8);
        bodyGeo.rotateX(-Math.PI / 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a6572, roughness: 0.4 });
        const fallbackShark = new THREE.Mesh(bodyGeo, bodyMat);
        sharkContainer.add(fallbackShark);

        let mixer = null;
        const clock = new THREE.Clock();

        // CARICAMENTO FILE GLTF
        const loader = new GLTFLoader();
        loader.load(
            'scene.gltf',
            (gltf) => {
                const loadedMesh = gltf.scene;

                // Calcola dimensioni reali del modello caricato
                const box = new THREE.Box3().setFromObject(loadedMesh);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                if (maxDim > 0) {
                    const targetScale = 6 / maxDim;
                    loadedMesh.scale.set(targetScale, targetScale, targetScale);
                }

                // Centra la geometria
                const center = box.getCenter(new THREE.Vector3());
                loadedMesh.position.sub(center.multiplyScalar(loadedMesh.scale.x));

                // Rimuove lo squalo di riserva e inserisce quello scaricato
                sharkContainer.remove(fallbackShark);
                sharkContainer.add(loadedMesh);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(loadedMesh);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
            },
            undefined,
            (err) => console.log("Caricamento modello custom fallito, uso riserva", err)
        );

        const preyList = [];
        const preyGeo = new THREE.ConeGeometry(0.3, 1, 6);
        preyGeo.rotateX(Math.PI / 2);

        for (let i = 0; i < 70; i++) {
            const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, roughness: 0.3 });
            const fish = new THREE.Mesh(preyGeo, mat);
            fish.position.set(
                (Math.random() - 0.5) * 200,
                Math.random() * 20 - 15,
                (Math.random() - 0.5) * 200
            );
            fish.userData = { speed: Math.random() * 0.05 + 0.02 };
            scene.add(fish);
            preyList.push(fish);
        }

        let moveInput = { x: 0, y: 0 };
        let isDashing = false;
        let score = 0;
        let eatenCount = 0;

        const joystickContainer = document.getElementById('joystick-container');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickActive = false;
        let joystickCenter = { x: 0, y: 0 };

        function handleStart(e) {
            joystickActive = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = joystickContainer.getBoundingClientRect();
            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            handleMove(e);
        }

        function handleMove(e) {
            if (!joystickActive) return;
            const touch = e.touches ? e.touches[0] : e;
            const dx = touch.clientX - joystickCenter.x;
            const dy = touch.clientY - joystickCenter.y;
            const dist = Math.min(Math.hypot(dx, dy), 35);
            const angle = Math.atan2(dy, dx);

            const knobX = Math.cos(angle) * dist;
            const knobY = Math.sin(angle) * dist;

            joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
            moveInput.x = knobX / 35;
            moveInput.y = knobY / 35;
        }

        function handleEnd() {
            joystickActive = false;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveInput = { x: 0, y: 0 };
        }

        joystickContainer.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);
        joystickContainer.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        document.getElementById('btn-dash').addEventListener('click', () => {
            if (isDashing) return;
            isDashing = true;
            setTimeout(() => isDashing = false, 1000);
        });

        document.getElementById('btn-bite').addEventListener('click', () => {
            const sharkPos = sharkContainer.position;
            for (let i = preyList.length - 1; i >= 0; i--) {
                const prey = preyList[i];
                if (prey.position.distanceTo(sharkPos) < 4.5) {
                    scene.remove(prey);
                    preyList.splice(i, 1);
                    score += 100;
                    eatenCount++;
                    document.getElementById('score').innerText = score;
                    document.getElementById('eaten').innerText = eatenCount;
                }
            }
        });

        let cameraAngleYaw = 0;
        let cameraAnglePitch = 0.2;
        let isDraggingCam = false;
        let prevTouch = { x: 0, y: 0 };

        window.addEventListener('pointerdown', (e) => {
            if (e.clientX > window.innerWidth / 2) {
                isDraggingCam = true;
                prevTouch = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDraggingCam) return;
            const dx = e.clientX - prevTouch.x;
            const dy = e.clientY - prevTouch.y;

            cameraAngleYaw -= dx * 0.005;
            cameraAnglePitch = Math.max(-0.4, Math.min(0.6, cameraAnglePitch + dy * 0.005));

            prevTouch = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => isDraggingCam = false);

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);

            const speed = isDashing ? 0.35 : 0.15;

            if (Math.abs(moveInput.x) > 0.05 || Math.abs(moveInput.y) > 0.05) {
                sharkContainer.rotation.y -= moveInput.x * 0.03;
                sharkContainer.translateZ(moveInput.y * speed);
                sharkContainer.position.y = Math.max(-28, Math.min(10, sharkContainer.position.y - moveInput.y * 0.05));
            }

            const camDist = 10;
            const camX = sharkContainer.position.x + camDist * Math.sin(cameraAngleYaw) * Math.cos(cameraAnglePitch);
            const camY = sharkContainer.position.y + camDist * Math.sin(cameraAnglePitch) + 2;
            const camZ = sharkContainer.position.z + camDist * Math.cos(cameraAngleYaw) * Math.cos(cameraAnglePitch);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(sharkContainer.position.x, sharkContainer.position.y, sharkContainer.position.z);

            preyList.forEach(prey => {
                prey.translateZ(prey.userData.speed);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
