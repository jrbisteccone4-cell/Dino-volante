<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRBISTECCONE17 | Ultimate Gaming & Streaming Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07080c;
            --surface-dark: #0f111a;
            --surface-card: #161925;
            --border-glow: rgba(0, 240, 255, 0.2);
            --neon-cyan: #00f0ff;
            --neon-purple: #9d00ff;
            --accent-pink: #ff007f;
            --text-main: #f0f2f5;
            --text-muted: #8b9bb4;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3, h4, .brand-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* Header & Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(7, 8, 12, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            border-bottom: 1px solid var(--border-glow);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .avatar-badge {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--text-main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .nav-cta {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)) !important;
            color: var(--bg-dark) !important;
            padding: 0.6rem 1.4rem;
            border-radius: 6px;
            font-weight: 700 !important;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 9rem 2rem 5rem;
            max-width: 1300px;
            margin: 0 auto;
            gap: 4rem;
        }

        .hero-content {
            flex: 1.2;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 0, 127, 0.12);
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink);
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
