<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzatore Donna Cyberpunk</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Sfondo scuro per far risaltare i neon */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Contenitore del visualizzatore */
        .viewer-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* L'elemento che mostra il 3D */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent; /* Rimuove il colore di caricamento */
        }

        /* Istruzioni per l'utente (visibili su mobile) */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            pointer-events: none; /* Non interferisce con i controlli 3D */
            animation: fadeOut 4s forwards; /* Scompare dopo 4 secondi */
            opacity: 1;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="viewer-container">
        <model-viewer 
            src="donna-cyberpunk.glb" 
            alt="Modello 3D Donna Cyberpunk"
            camera-controls 
            auto-rotate 
            rotation-per-second="10deg"
            environment-image="neutral" 
            exposure="1"
            shadow-intensity="1"
            ar
            quick-look-browsers="safari chrome">
            
            <div class="instructions">
                Tocca e trascina per ruotare | Pizzica per zoomare
            </div>

        </model-viewer>
    </div>

</body>
</html>
