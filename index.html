<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino Volante Mobile</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; background: #70c5ce; touch-action: none; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.6); color: white; text-align: center; padding: 20px; z-index: 10;
    }
    h1 { margin-bottom: 10px; font-size: 2rem; }
    p { font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }
    button {
      padding: 18px 45px; font-size: 1.3rem; font-weight: bold; border: none;
      border-radius: 30px; background: #ff5722; color: white; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h1 id="title">Dino Volante 🦕</h1>
    <p>Inclina il telefono a destra/sinistra per girare.<br>Tocca lo schermo per volare in alto!</p>
    <button id="startBtn">GIOCA ORA</button>
  </div>
  
  <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let dino = { x: 0, y: 0, vx: 0, vy: 0, size: 25 };
let obstacles = [];
let score = 0;
let gameOver = false;
let gameRunning = false;
let frameCount = 0;

const gravity = 0.35;
const flapPower = -7.5;
let tiltX = 0;

// Gestione Tocchi Schermo (Volo)
window.addEventListener('touchstart', (e) => {
  if (gameRunning && !gameOver) {
    e.preventDefault();
    dino.vy = flapPower;
  }
}, { passive: false });

// Gestione Accelerometro (Inclinazione)
function handleOrientation(e) {
  if (e.gamma !== null && e.gamma !== undefined) {
    tiltX = e.gamma;
  }
}

// Avvio Gioco diretto al click
startBtn.addEventListener('touchend', initGame);
startBtn.addEventListener('click', initGame);

function initGame(e) {
  if (e) e.preventDefault();
  
  // Richiesta permessi iOS per giroscopio
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(permissionState => {
        if (permissionState === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
        }
        startGame();
      })
      .catch(() => startGame());
  } else {
    window.addEventListener('deviceorientation', handleOrientation);
    startGame();
  }
}

function startGame() {
  dino.x = canvas.width / 2;
  dino.y = canvas.height / 2;
  dino.vx = 0;
  dino.vy = 0;
  obstacles = [];
  score = 0;
  gameOver = false;
  gameRunning = true;
  frameCount = 0;
  overlay.style.display = 'none';
  loop();
}

function spawnObstacle() {
  const gap = 180;
  const topHeight = Math.random() * (canvas.height - gap - 120) + 60;
  obstacles.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - gap,
    passed: false
  });
}

function loop() {
  if (!gameRunning) return;

  // Fisica
  dino.vy += gravity;
  dino.y += dino.vy;
  dino.vx = tiltX * 0.45;
  dino.x += dino.vx;

  // Limiti bordi
  if (dino.x - dino.size < 0) dino.x = dino.size;
  if (dino.x + dino.size > canvas.width) dino.x = canvas.width - dino.size;

  // Generazione ostacoli
  frameCount++;
  if (frameCount % 90 === 0) spawnObstacle();

  // Rendering
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Dinosauro
  ctx.fillStyle = '#4CAF50';
  ctx.beginPath();
  ctx.arc(dino.x, dino.y, dino.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#2E7D32';
  ctx.fillRect(dino.x - 8, dino.y - 4, 10, 8);

  // Ostacoli
  ctx.fillStyle = '#795548';
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.x -= 3.5;

    ctx.fillRect(obs.x, 0, 50, obs.top);
    ctx.fillRect(obs.x, canvas.height - obs.bottom, 50, obs.bottom);

    if (!obs.passed && obs.x < dino.x) {
      score++;
      obs.passed = true;
    }

    if (
      dino.x + dino.size > obs.x && dino.x - dino.size < obs.x + 50 &&
      (dino.y - dino.size < obs.top || dino.y + dino.size > canvas.height - obs.bottom)
    ) {
      triggerGameOver();
    }

    if (obs.x < -50) obstacles.splice(i, 1);
  }

  // Collisione soffitto/pavimento
  if (dino.y + dino.size > canvas.height || dino.y - dino.size < 0) {
    triggerGameOver();
  }

  // Punteggio
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText(`Punti: ${score}`, 20, 40);

  if (!gameOver) {
    requestAnimationFrame(loop);
  }
}

function triggerGameOver() {
  gameOver = true;
  gameRunning = false;
  document.getElementById('title').innerText = 'Game Over! 💥';
  startBtn.innerText = 'RICOMINCIA';
  overlay.style.display = 'flex';
}
</script>
</body>
</html>
