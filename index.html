<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Game - Ottimizzato</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        #hud {
            position: absolute; top: 15px; left: 15px; color: #222; font-size: 12px; font-weight: bold;
            font-family: monospace; pointer-events: none; z-index: 10; background: rgba(255,255,255,0.85);
            padding: 6px 10px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        #status-log {
            position: absolute; top: 65px; left: 15px; color: #0066cc; font-size: 11px;
            font-family: monospace; pointer-events: none; z-index: 10; font-weight: bold;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 20px; width: 120px; height: 120px;
            background: rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 37px; left: 37px; width: 46px; height: 46px;
            background: #222; border: 2px solid #fff; border-radius: 50%;
            pointer-events: none;
        }

        .btn-action {
            position: absolute; width: 68px; height: 68px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6); color: white; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center; touch-action: none;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }
        .btn-action:active { transform: scale(0.9); }
        #btn-cam { bottom: 30px; right: 20px; background: #007acc; }
        #btn-jump { bottom: 110px; right: 20px; background: #28a745; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="hud">
        STATO: <span id="status-text">CARICAMENTO...</span><br>
        POS: X:<span id="posX">0</span> Y:<span id="posY">0</span> Z:<span id="posZ">0</span>
    </div>
    <div id="status-log">Inizializzazione...</div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-jump" class="btn-action">SALTA</div>
    <div id="btn-cam" class="btn-action">VISTA</div>

    <script>
        function log(msg) { document.getElementById('status-log').innerText = msg; }

        let scene, camera, renderer, playerGroup, characterMesh, mapMesh;
        const clock = new THREE.Clock();
        
        let moveInput = { x: 0, y: 0 };
        let playerPos = new THREE.Vector3(0, 0, 0);
        let playerRotation = 0;
        let cameraYaw = 0;
        let cameraPitch = 0.15;
        let verticalVelocity = 0;
        let isGrounded = true;
        let cameraMode = 0;

        const raycaster = new THREE.Raycaster();
        const collidableObjects = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.FogExp2(0x0a0a0a, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Limite pixelRatio per eliminare il lag
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 30, 10);
            scene.add(mainLight);

            loadMap();
            loadCharacter();
            setupControls();

            animate();
        }

        function loadMap() {
            log("Caricamento mappa.glb...");
            const loader = new THREE.GLTFLoader();

            loader.load('mappa.glb', (gltf) => {
                mapMesh = gltf.scene;

                const box = new THREE.Box3().setFromObject(mapMesh);
                const center = box.getCenter(new THREE.Vector3());
                
                mapMesh.position.x = -center.x;
                mapMesh.position.z = -center.z;
                mapMesh.position.y = -box.min.y;

                mapMesh.traverse((child) => {
                    if (child.isMesh) {
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                        }
                        collidableObjects.push(child);
                    }
                });
                
                scene.add(mapMesh);
                spawnPlayerSafely();
                log("Mappa pronta!");
            }, null, (error) => {
                log("Errore carica mappa!");
                console.error(error);
            });
        }

        function spawnPlayerSafely() {
            playerPos.set(0, 20, 0);
            raycaster.set(playerPos, new THREE.Vector3(0, -1, 0));
            const hits = raycaster.intersectObjects(collidableObjects, true);

            if (hits.length > 0) {
                playerPos.y = hits[0].point.y + 0.05;
            } else {
                playerPos.set(0, 0.05, 0);
            }
        }

        function loadCharacter() {
            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            log("Caricamento personaggio.glb...");
            const loader = new THREE.GLTFLoader();

            loader.load('personaggio.glb', (gltf) => {
                characterMesh = gltf.scene;

                const box = new THREE.Box3().setFromObject(characterMesh);
                const size = box.getSize(new THREE.Vector3());
                
                // DIMENSIONE PERSONAGGIO RIDOTTA (0.85m anziché 1.4m)
                const targetHeight = 0.85; 
                const scaleFactor = targetHeight / (size.y || 1);
                
                characterMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
                
                const updatedBox = new THREE.Box3().setFromObject(characterMesh);
                characterMesh.position.y = -updatedBox.min.y;

                playerGroup.add(characterMesh);
                document.getElementById('status-text').innerText = "PRONTO";
                log("Giocatore pronto!");
            }, null, (error) => {
                console.error(error);
            });
        }

        function setupControls() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let joystickTouchId = null;
            let cameraTouchId = null;
            let joystickCenter = { x: 0, y: 0 };
            let lastTouchPos = { x: 0, y: 0 };

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const rect = container.getBoundingClientRect();

                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        if (joystickTouchId === null) {
                            joystickTouchId = touch.identifier;
                            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                            updateJoystick(touch);
                        }
                    } else if (touch.clientX > window.innerWidth / 3 && cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];

                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === cameraTouchId) {
                        const dx = touch.clientX - lastTouchPos.x;
                        const dy = touch.clientY - lastTouchPos.y;

                        cameraYaw -= dx * 0.004;
                        cameraPitch = Math.max(-0.3, Math.min(0.6, cameraPitch + dy * 0.004));

                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            const stopTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        moveInput = { x: 0, y: 0 };
                    }
                    if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', stopTouch);
            window.addEventListener('touchcancel', stopTouch);

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                
                moveInput.x = (dx / maxDist);
                moveInput.y = (dy / maxDist);
            }

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGrounded) {
                    verticalVelocity = 0.14;
                    isGrounded = false;
                }
            }, { passive: false });

            document.getElementById('btn-cam').addEventListener('touchstart', (e) => {
                e.preventDefault();
                cameraMode = (cameraMode + 1) % 2;
            }, { passive: false });
        }

        // CONTROL FISICO FLUIDO E LEGGERO (ANTI-LAG)
        function canMoveTo(nextPos) {
            if (collidableObjects.length === 0) return true;

            const origin = nextPos.clone();
            origin.y += 0.4;

            const dirs = [
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-1, 0, 0),
                new THREE.Vector3(0, 0, 1),
                new THREE.Vector3(0, 0, -1)
            ];

            for (let dir of dirs) {
                raycaster.set(origin, dir);
                const hits = raycaster.intersectObjects(collidableObjects, true);
                if (hits.length > 0 && hits[0].distance < 0.35) {
                    return false;
                }
            }
            return true;
        }

        // FISICA FISICA SALTO, SOFFITTO E PAVIMENTO
        function updatePhysics() {
            if (collidableObjects.length === 0) return;

            // 1. Controllo Soffitto (Impedisce di superare il tetto quando si salta)
            if (verticalVelocity > 0) {
                const headOrigin = playerPos.clone();
                headOrigin.y += 0.7;
                raycaster.set(headOrigin, new THREE.Vector3(0, 1, 0));
                const ceilingHits = raycaster.intersectObjects(collidableObjects, true);

                if (ceilingHits.length > 0 && ceilingHits[0].distance < 0.2) {
                    verticalVelocity = 0; // Blocca la salita se tocca il soffitto
                }
            }

            // 2. Controllo Pavimento
            const rayOrigin = playerPos.clone();
            rayOrigin.y += 0.6;
            raycaster.set(rayOrigin, new THREE.Vector3(0, -1, 0));

            const floorHits = raycaster.intersectObjects(collidableObjects, true);

            if (floorHits.length > 0) {
                const floorY = floorHits[0].point.y;
                if (playerPos.y <= floorY + 0.05 && verticalVelocity <= 0) {
                    playerPos.y = floorY;
                    verticalVelocity = 0;
                    isGrounded = true;
                } else {
                    isGrounded = false;
                }
            } else {
                if (playerPos.y <= 0) {
                    playerPos.y = 0;
                    verticalVelocity = 0;
                    isGrounded = true;
                } else {
                    isGrounded = false;
                }
            }

            if (!isGrounded) {
                verticalVelocity -= 0.009;
                playerPos.y += verticalVelocity;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePhysics();

            const inputMag = Math.hypot(moveInput.x, moveInput.y);
            const speed = 0.075;

            if (inputMag > 0.1) {
                const moveAngle = Math.atan2(-moveInput.x, -moveInput.y) + cameraYaw;
                playerRotation = moveAngle;

                const moveDir = new THREE.Vector3(
                    Math.sin(moveAngle) * speed * inputMag,
                    0,
                    Math.cos(moveAngle) * speed * inputMag
                );

                const targetX = playerPos.clone();
                targetX.x += moveDir.x;
                if (canMoveTo(targetX)) playerPos.x = targetX.x;

                const targetZ = playerPos.clone();
                targetZ.z += moveDir.z;
                if (canMoveTo(targetZ)) playerPos.z = targetZ.z;
            }

            if (playerGroup) {
                playerGroup.position.copy(playerPos);
                playerGroup.rotation.y = playerRotation;
            }

            // TELECAMERA INTELLIGENTE CON COLLISIONE AI MURI 360°
            if (cameraMode === 0) {
                const targetDist = 2.0;
                const headPos = playerPos.clone().add(new THREE.Vector3(0, 0.7, 0));
                
                const camDir = new THREE.Vector3(
                    -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                    Math.sin(cameraPitch),
                    -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                ).normalize();

                // Raycast dal personaggio alla telecamera per evitare che la visuale compenetri i muri
                raycaster.set(headPos, camDir);
                const camHits = raycaster.intersectObjects(collidableObjects, true);

                let actualDist = targetDist;
                if (camHits.length > 0 && camHits[0].distance < targetDist) {
                    actualDist = Math.max(0.4, camHits[0].distance - 0.15);
                }

                camera.position.copy(headPos).add(camDir.multiplyScalar(actualDist));
                camera.lookAt(playerPos.x, playerPos.y + 0.7, playerPos.z);
            } else {
                // Prima persona
                camera.position.set(playerPos.x, playerPos.y + 0.75, playerPos.z);
                const lookTarget = new THREE.Vector3(
                    playerPos.x + Math.sin(cameraYaw) * 5,
                    playerPos.y + 0.75 - Math.sin(cameraPitch) * 5,
                    playerPos.z + Math.cos(cameraYaw) * 5
                );
                camera.lookAt(lookTarget);
            }

            document.getElementById('posX').innerText = playerPos.x.toFixed(1);
            document.getElementById('posY').innerText = playerPos.y.toFixed(1);
            document.getElementById('posZ').innerText = playerPos.z.toFixed(1);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
