<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Game - Stabile</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; position: fixed; }
        canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 1; }

        #hud {
            position: absolute; top: 15px; left: 15px; color: #222; font-size: 12px; font-weight: bold;
            font-family: monospace; pointer-events: none; z-index: 10; background: rgba(255,255,255,0.85);
            padding: 6px 10px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        #status-log {
            position: absolute; top: 65px; left: 15px; color: #00ffcc; font-size: 11px;
            font-family: monospace; pointer-events: none; z-index: 10; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 6px 10px; border-radius: 4px; max-width: 90vw;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 20px; width: 120px; height: 120px;
            background: rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 37px; left: 37px; width: 46px; height: 46px;
            background: #222; border: 2px solid #fff; border-radius: 50%;
            pointer-events: none;
        }

        .btn-action {
            position: absolute; width: 68px; height: 68px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6); color: white; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; justify-content: center; touch-action: none;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; text-align: center;
        }
        .btn-action:active { transform: scale(0.9); }
        #btn-cam { bottom: 30px; right: 20px; background: #007acc; }
        #btn-jump { bottom: 110px; right: 20px; background: #28a745; }
        #btn-interact { bottom: 30px; right: 100px; background: #ff9800; display: flex; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="hud">
        STATO: <span id="status-text">AVVIO...</span><br>
        POS: X:<span id="posX">0</span> Y:<span id="posY">0</span> Z:<span id="posZ">0</span>
    </div>
    <div id="status-log">Inizializzazione...</div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-jump" class="btn-action">SALTA</div>
    <div id="btn-cam" class="btn-action">VISTA</div>
    <div id="btn-interact" class="btn-action">APRI</div>

    <script>
        function log(msg) { 
            console.log(msg);
            document.getElementById('status-log').innerText = msg; 
        }

        let scene, camera, renderer, playerGroup, characterMesh, mapMesh;
        let currentMapFile = 'mappa.glb'; 

        const clock = new THREE.Clock();
        let moveInput = { x: 0, y: 0 };
        let playerPos = new THREE.Vector3(0, 0, 0);
        let playerRotation = 0;
        let cameraYaw = 0;
        let cameraPitch = 0.15;
        let isMapLoaded = false;
        let cameraMode = 0;
        let walkCycle = 0;

        // Configurazione delle coordinate di spawn per ogni mappa
        const mapSpawnPoints = {
            'mappa.glb': { custom: false, x: 0, y: 0, z: 0 },
            'mappa2.glb': { custom: false, x: 0, y: 0, z: 0 } // Modifica custom: true e inserisci x, y, z se vuoi uno spawn fisso
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.FogExp2(0x0a0a0a, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 20, 10);
            scene.add(mainLight);

            loadCharacter();
            loadMap(currentMapFile);
            setupControls();

            animate();
        }

        function loadMap(filename) {
            isMapLoaded = false; 
            log("Caricamento " + filename + "...");
            document.getElementById('status-text').innerText = "CARICAMENTO";

            const loader = new THREE.GLTFLoader();

            loader.load(filename, (gltf) => {
                try {
                    if (mapMesh) {
                        scene.remove(mapMesh);
                    }

                    mapMesh = gltf.scene;
                    scene.add(mapMesh);

                    // Centratura geometrica della mappa a Y = 0
                    const box = new THREE.Box3().setFromObject(mapMesh);
                    const center = box.getCenter(new THREE.Vector3());
                    
                    mapMesh.position.x = -center.x;
                    mapMesh.position.z = -center.z;
                    mapMesh.position.y = -box.min.y;

                    mapMesh.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.side = THREE.DoubleSide;
                        }
                    });

                    // Gestione dello spawn pulita senza raycast instabili
                    const config = mapSpawnPoints[filename];
                    if (config && config.custom) {
                        playerPos.set(config.x, config.y, config.z);
                    } else {
                        playerPos.set(0, 0.0, 0); // Posizione sicura sul piano base della mappa
                    }

                    isMapLoaded = true; 
                    document.getElementById('status-text').innerText = "PRONTO";
                    log("Mappa pronta e stabile!");
                } catch (err) {
                    log("Errore script: " + err.message);
                    console.error(err);
                }
            }, undefined, (error) => {
                log("Errore file: " + filename + " non trovato!");
                console.error(error);
            });
        }

        function loadCharacter() {
            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            const loader = new THREE.GLTFLoader();
            loader.load('personaggio.glb', (gltf) => {
                characterMesh = gltf.scene;

                characterMesh.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                const box = new THREE.Box3().setFromObject(characterMesh);
                const size = box.getSize(new THREE.Vector3());
                const targetHeight = 1.15; 
                const scaleFactor = targetHeight / (size.y || 1);
                characterMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);

                const updatedBox = new THREE.Box3().setFromObject(characterMesh);
                characterMesh.position.y = -updatedBox.min.y;

                playerGroup.add(characterMesh);
                log("Personaggio pronto!");
            }, undefined, (error) => {
                log("Errore: personaggio.glb non trovato!");
                console.error(error);
            });
        }

        function setupControls() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let joystickTouchId = null;
            let cameraTouchId = null;
            let joystickCenter = { x: 0, y: 0 };
            let lastTouchPos = { x: 0, y: 0 };

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const rect = container.getBoundingClientRect();

                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        if (joystickTouchId === null) {
                            joystickTouchId = touch.identifier;
                            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                            updateJoystick(touch);
                        }
                    } else if (touch.clientX > window.innerWidth / 3 && cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];

                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === cameraTouchId) {
                        const dx = touch.clientX - lastTouchPos.x;
                        const dy = touch.clientY - lastTouchPos.y;

                        cameraYaw -= dx * 0.004;
                        cameraPitch = Math.max(-0.3, Math.min(0.6, cameraPitch + dy * 0.004));

                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            const stopTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        moveInput = { x: 0, y: 0 };
                    }
                    if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', stopTouch);
            window.addEventListener('touchcancel', stopTouch);

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                
                moveInput.x = (dx / maxDist);
                moveInput.y = (dy / maxDist);
            }

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                // Salto disattivato temporaneamente per stabilità dei movimenti base
            }, { passive: false });

            document.getElementById('btn-cam').addEventListener('touchstart', (e) => {
                e.preventDefault();
                cameraMode = (cameraMode + 1) % 2;
            }, { passive: false });

            document.getElementById('btn-interact').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isMapLoaded) return; 
                currentMapFile = (currentMapFile === 'mappa.glb') ? 'mappa2.glb' : 'mappa.glb';
                loadMap(currentMapFile);
            }, { passive: false });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const inputMag = Math.hypot(moveInput.x, moveInput.y);
            const speed = 0.04; 

            if (isMapLoaded && inputMag > 0.1) {
                const moveAngle = Math.atan2(-moveInput.x, -moveInput.y) + cameraYaw;
                playerRotation = moveAngle;

                const moveDir = new THREE.Vector3(
                    Math.sin(moveAngle) * speed * inputMag,
                    0,
                    Math.cos(moveAngle) * speed * inputMag
                );

                playerPos.x += moveDir.x;
                playerPos.z += moveDir.z;

                walkCycle += delta * 8 * inputMag;
                if (characterMesh) {
                    characterMesh.position.y = Math.abs(Math.sin(walkCycle)) * 0.015;
                }
            } else {
                walkCycle = 0;
                if (characterMesh) {
                    characterMesh.position.y = THREE.MathUtils.lerp(characterMesh.position.y, 0, 0.1);
                }
            }

            if (playerGroup) {
                playerGroup.position.copy(playerPos);
                playerGroup.rotation.y = playerRotation;
            }

            if (cameraMode === 0) {
                const targetDist = 2.0;
                const headPos = playerPos.clone().add(new THREE.Vector3(0, 0.8, 0));
                
                const camDir = new THREE.Vector3(
                    -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                    Math.sin(cameraPitch),
                    -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                ).normalize();

                camera.position.copy(headPos).add(camDir.multiplyScalar(targetDist));
                camera.lookAt(playerPos.x, playerPos.y + 0.8, playerPos.z);
            } else {
                camera.position.set(playerPos.x, playerPos.y + 0.85, playerPos.z);
                const lookTarget = new THREE.Vector3(
                    playerPos.x + Math.sin(cameraYaw) * 5,
                    playerPos.y + 0.85 - Math.sin(cameraPitch) * 5,
                    playerPos.z + Math.cos(cameraYaw) * 5
                );
                camera.lookAt(lookTarget);
            }

            document.getElementById('posX').innerText = playerPos.x.toFixed(1);
            document.getElementById('posY').innerText = playerPos.y.toFixed(1);
            document.getElementById('posZ').innerText = playerPos.z.toFixed(1);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
