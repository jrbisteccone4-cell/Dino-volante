<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Shark Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #011326; font-family: sans-serif; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        #hud {
            position: absolute; top: 15px; left: 15px; color: #fff; font-size: 16px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10;
        }

        #status-log {
            position: absolute; top: 40px; left: 15px; color: #00ffcc; font-size: 12px;
            font-family: monospace; z-index: 10; pointer-events: none;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #ffffff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
        }

        .btn-action {
            position: absolute; width: 75px; height: 75px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6); color: white; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center; touch-action: manipulation;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }
        .btn-action:active { transform: scale(0.9); }
        #btn-bite { bottom: 35px; right: 30px; background: rgba(220, 53, 69, 0.85); }
        #btn-dash { bottom: 125px; right: 35px; background: rgba(255, 193, 7, 0.85); color: #000; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="hud">Punti: <span id="score">0</span> | Prede Divorate: <span id="eaten">0</span></div>
    <div id="status-log">Inizializzazione...</div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-dash" class="btn-action">SCATTO</div>
    <div id="btn-bite" class="btn-action">MORDI</div>

    <script>
        function log(msg) {
            document.getElementById('status-log').innerText = msg;
        }

        let scene, camera, renderer, sharkContainer;
        let mixer = null;
        const clock = new THREE.Clock();
        const preyList = [];
        let moveInput = { x: 0, y: 0 };
        let isDashing = false;
        let score = 0, eatenCount = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x011326);
            scene.fog = new THREE.FogExp2(0x011326, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 3.0);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            const seabedGeo = new THREE.PlaneGeometry(1000, 1000);
            const seabedMat = new THREE.MeshPhongMaterial({ color: 0x07202e });
            const seabed = new THREE.Mesh(seabedGeo, seabedMat);
            seabed.rotation.x = -Math.PI / 2;
            seabed.position.y = -60;
            scene.add(seabed);

            sharkContainer = new THREE.Group();
            scene.add(sharkContainer);

            loadGLTFModel();
            createPreys();
            setupJoystick();
            setupButtons();

            animate();
        }

        function loadGLTFModel() {
            log("Caricamento scene.gltf...");
            const loader = new THREE.GLTFLoader();
            
            loader.load('./scene.gltf', (gltf) => {
                log("Squalo caricato con successo!");
                const loadedMesh = gltf.scene;

                loadedMesh.traverse((child) => {
                    if (child.isMesh) {
                        child.material.side = THREE.DoubleSide;
                    }
                });

                const box = new THREE.Box3().setFromObject(loadedMesh);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                loadedMesh.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const scaleFactor = 10 / maxDim;
                    loadedMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
                }

                sharkContainer.add(loadedMesh);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(loadedMesh);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
            }, 
            undefined, 
            (err) => {
                log("Errore nel caricamento del file.");
            });
        }

        function createPreys() {
            const preyGeo = new THREE.ConeGeometry(0.6, 2.0, 6);
            preyGeo.rotateX(Math.PI / 2);

            for (let i = 0; i < 60; i++) {
                const mat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
                const fish = new THREE.Mesh(preyGeo, mat);
                fish.position.set(
                    (Math.random() - 0.5) * 300,
                    Math.random() * 40 - 20,
                    (Math.random() - 0.5) * 300
                );
                fish.userData = { speed: Math.random() * 0.1 + 0.05 };
                scene.add(fish);
                preyList.push(fish);
            }
        }

        function setupJoystick() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let active = false, center = { x: 0, y: 0 }, touchId = null;

            function start(e) {
                if (active) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                if (e.changedTouches) touchId = touch.identifier;
                const rect = container.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                active = true;
                move(e);
            }

            function move(e) {
                if (!active) return;
                let touch = null;
                if (e.touches) {
                    for (let i = 0; i < e.touches.length; i++) {
                        if (e.touches[i].identifier === touchId) { touch = e.touches[i]; break; }
                    }
                    if (!touch) return;
                } else { touch = e; }

                const dx = touch.clientX - center.x;
                const dy = touch.clientY - center.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                const knobX = Math.cos(angle) * dist;
                const knobY = Math.sin(angle) * dist;

                knob.style.transform = `translate(${knobX}px, ${knobY}px)`;
                moveInput.x = knobX / maxDist;
                moveInput.y = knobY / maxDist;
            }

            function end(e) {
                if (!active) return;
                active = false; touchId = null;
                knob.style.transform = `translate(0px, 0px)`;
                moveInput = { x: 0, y: 0 };
            }

            container.addEventListener('touchstart', start, { passive: false });
            window.addEventListener('touchmove', move, { passive: false });
            window.addEventListener('touchend', end);
            container.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
        }

        function setupButtons() {
            document.getElementById('btn-dash').addEventListener('click', () => {
                if (isDashing) return;
                isDashing = true;
                setTimeout(() => isDashing = false, 1200);
            });

            document.getElementById('btn-bite').addEventListener('click', () => {
                const sharkPos = sharkContainer.position;
                for (let i = preyList.length - 1; i >= 0; i--) {
                    const prey = preyList[i];
                    if (prey.position.distanceTo(sharkPos) < 12.0) {
                        scene.remove(prey);
                        preyList.splice(i, 1);
                        score += 100;
                        eatenCount++;
                        document.getElementById('score').innerText = score;
                        document.getElementById('eaten').innerText = eatenCount;
                    }
                }
            });
        }

        let targetPitch = 0, targetYaw = 0, currentPitch = 0, currentYaw = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (mixer) mixer.update(delta);

            const speed = isDashing ? 0.5 : 0.25;

            if (Math.hypot(moveInput.x, moveInput.y) > 0.05) {
                targetYaw -= moveInput.x * 0.04;
                targetPitch = THREE.MathUtils.clamp(targetPitch - moveInput.y * 0.03, -0.6, 0.6);
            } else {
                targetPitch = THREE.MathUtils.lerp(targetPitch, 0, 0.02);
            }

            currentYaw = THREE.MathUtils.lerp(currentYaw, targetYaw, 0.08);
            currentPitch = THREE.MathUtils.lerp(currentPitch, targetPitch, 0.08);

            sharkContainer.rotation.identity();
            sharkContainer.rotation.y = currentYaw;
            sharkContainer.rotateX(currentPitch);

            const moveDir = new THREE.Vector3(0, 0, -1).applyQuaternion(sharkContainer.quaternion);
            sharkContainer.position.addScaledVector(moveDir, speed);
            sharkContainer.position.y = THREE.MathUtils.clamp(sharkContainer.position.y, -50, 30);

            const camOffset = new THREE.Vector3(0, 8, 30).applyQuaternion(sharkContainer.quaternion);
            camera.position.copy(sharkContainer.position).add(camOffset);
            camera.lookAt(sharkContainer.position);

            preyList.forEach(prey => prey.translateZ(prey.userData.speed));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
