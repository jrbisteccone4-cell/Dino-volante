<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Robot in White Room</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #e0e0e0; font-family: sans-serif; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        #hud {
            position: absolute; top: 15px; left: 15px; color: #333; font-size: 14px; font-weight: bold;
            font-family: monospace; pointer-events: none; z-index: 10;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(0, 0, 0, 0.1); border: 2px solid rgba(0, 0, 0, 0.3);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #222; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); pointer-events: none;
        }

        .btn-action {
            position: absolute; width: 75px; height: 75px; border-radius: 50%;
            border: 2px solid rgba(0, 0, 0, 0.3); color: white; font-weight: bold; font-size: 13px;
            display: flex; align-items: center; justify-content: center; touch-action: manipulation;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer;
        }
        .btn-action:active { transform: scale(0.9); }
        #btn-cam { bottom: 35px; right: 30px; background: #007acc; }
        #btn-jump { bottom: 125px; right: 35px; background: #28a745; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        STATUS: ONLINE<br>
        POSIZIONE: X:<span id="posX">0</span> Z:<span id="posZ">0</span>
    </div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-jump" class="btn-action">SALTA</div>
    <div id="btn-cam" class="btn-action">VISTA</div>

    <script>
        let scene, camera, renderer, robotGroup;
        let leftLeg, rightLeg, leftArm, rightArm, headMesh, eyeMesh;
        const clock = new THREE.Clock();
        
        let moveInput = { x: 0, y: 0 };
        let robotPos = new THREE.Vector3(0, 0, 0);
        let robotRotation = 0;
        let verticalVelocity = 0;
        let isGrounded = true;
        
        let cameraMode = 0; // 0: Terza persona, 1: Prima persona (occhi robot)

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);
            scene.fog = new THREE.FogExp2(0xf0f0f0, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Illuminazione Stanza
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
            mainLight.position.set(20, 40, 20);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);

            // Luce azzurra soffusa per riflesso metallico
            const rimLight = new THREE.DirectionalLight(0x88ccff, 0.8);
            rimLight.position.set(-20, 20, -20);
            scene.add(rimLight);

            createWhiteRoomWithIronFloor();
            createRobot();

            setupJoystick();
            setupButtons();

            animate();
        }

        function createWhiteRoomWithIronFloor() {
            const roomSize = 80;

            // Pavimento in Ferro (Griglia metallica riflettente)
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#444c56';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#22272e';
            ctx.lineWidth = 6;
            for (let i = 0; i <= 256; i += 32) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
            }
            // Dettagli rivetti metallici
            ctx.fillStyle = '#8b949e';
            for (let x = 16; x < 256; x += 32) {
                for (let y = 16; y < 256; y += 32) {
                    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
                }
            }

            const ironTexture = new THREE.CanvasTexture(canvas);
            ironTexture.wrapS = THREE.RepeatWrapping;
            ironTexture.wrapT = THREE.RepeatWrapping;
            ironTexture.repeat.set(20, 20);

            const floorMat = new THREE.MeshStandardMaterial({
                map: ironTexture,
                roughness: 0.3,
                metalness: 0.8
            });
            const floorGeo = new THREE.PlaneGeometry(roomSize, roomSize);
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Pareti Bianche
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.9 });
            
            const wallGeo = new THREE.PlaneGeometry(roomSize, 30);
            
            // Parete Nord
            const wallN = new THREE.Mesh(wallGeo, wallMat);
            wallN.position.set(0, 15, -roomSize / 2);
            scene.add(wallN);

            // Parete Sud
            const wallS = new THREE.Mesh(wallGeo, wallMat);
            wallS.position.set(0, 15, roomSize / 2);
            wallS.rotation.y = Math.PI;
            scene.add(wallS);

            // Parete Est
            const wallE = new THREE.Mesh(wallGeo, wallMat);
            wallE.position.set(roomSize / 2, 15, 0);
            wallE.rotation.y = -Math.PI / 2;
            scene.add(wallE);

            // Parete Ovest
            const wallW = new THREE.Mesh(wallGeo, wallMat);
            wallW.position.set(-roomSize / 2, 15, 0);
            wallW.rotation.y = Math.PI / 2;
            scene.add(wallW);
        }

        function createRobot() {
            robotGroup = new THREE.Group();
            scene.add(robotGroup);

            const metalMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 });
            const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.4 });
            const cyanGlowMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });

            // Busto
            const torsoGeo = new THREE.BoxGeometry(1.4, 1.8, 1.0);
            const torso = new THREE.Mesh(torsoGeo, metalMat);
            torso.position.y = 2.4;
            torso.castShadow = true;
            robotGroup.add(torso);

            // Reattore nel petto
            const coreGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.1, 16);
            coreGeo.rotateX(Math.PI / 2);
            const core = new THREE.Mesh(coreGeo, cyanGlowMat);
            core.position.set(0, 2.6, 0.51);
            robotGroup.add(core);

            // Testa
            const headGeo = new THREE.BoxGeometry(0.9, 0.7, 0.8);
            headMesh = new THREE.Mesh(headGeo, metalMat);
            headMesh.position.y = 3.8;
            headMesh.castShadow = true;
            robotGroup.add(headMesh);

            // Visore Luminoso
            const eyeGeo = new THREE.BoxGeometry(0.7, 0.18, 0.1);
            eyeMesh = new THREE.Mesh(eyeGeo, cyanGlowMat);
            eyeMesh.position.set(0, 3.85, 0.41);
            robotGroup.add(eyeMesh);

            // Gambe
            const legGeo = new THREE.BoxGeometry(0.4, 1.4, 0.4);
            
            leftLeg = new THREE.Mesh(legGeo, darkMetalMat);
            leftLeg.position.set(0.4, 0.7, 0);
            leftLeg.castShadow = true;
            robotGroup.add(leftLeg);

            rightLeg = new THREE.Mesh(legGeo, darkMetalMat);
            rightLeg.position.set(-0.4, 0.7, 0);
            rightLeg.castShadow = true;
            robotGroup.add(rightLeg);

            // Braccia
            const armGeo = new THREE.BoxGeometry(0.35, 1.5, 0.35);
            
            leftArm = new THREE.Mesh(armGeo, metalMat);
            leftArm.position.set(1.0, 2.3, 0);
            leftArm.castShadow = true;
            robotGroup.add(leftArm);

            rightArm = new THREE.Mesh(armGeo, metalMat);
            rightArm.position.set(-1.0, 2.3, 0);
            rightArm.castShadow = true;
            robotGroup.add(rightArm);
        }

        function setupJoystick() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let active = false, center = { x: 0, y: 0 }, touchId = null;

            function start(e) {
                if (active) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                if (e.changedTouches) touchId = touch.identifier;
                const rect = container.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                active = true;
                move(e);
            }

            function move(e) {
                if (!active) return;
                let touch = null;
                if (e.touches) {
                    for (let i = 0; i < e.touches.length; i++) {
                        if (e.touches[i].identifier === touchId) { touch = e.touches[i]; break; }
                    }
                    if (!touch) return;
                } else { touch = e; }

                const dx = touch.clientX - center.x;
                const dy = touch.clientY - center.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                moveInput.x = (Math.cos(angle) * dist) / maxDist;
                moveInput.y = (Math.sin(angle) * dist) / maxDist;
            }

            function end() {
                if (!active) return;
                active = false; touchId = null;
                knob.style.transform = `translate(0px, 0px)`;
                moveInput = { x: 0, y: 0 };
            }

            container.addEventListener('touchstart', start, { passive: false });
            window.addEventListener('touchmove', move, { passive: false });
            window.addEventListener('touchend', end);
            container.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
        }

        function setupButtons() {
            document.getElementById('btn-jump').addEventListener('click', () => {
                if (isGrounded) {
                    verticalVelocity = 0.22;
                    isGrounded = false;
                }
            });

            document.getElementById('btn-cam').addEventListener('click', () => {
                cameraMode = (cameraMode + 1) % 2;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Movimento e Rotazione Robot
            const inputMag = Math.hypot(moveInput.x, moveInput.y);
            const speed = 0.15;

            if (inputMag > 0.1) {
                const targetAngle = Math.atan2(-moveInput.x, -moveInput.y);
                
                // Rotazione fluida verso la direzione
                let diff = targetAngle - robotRotation;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                robotRotation += diff * 0.15;

                robotPos.x += Math.sin(robotRotation) * speed * inputMag;
                robotPos.z += Math.cos(robotRotation) * speed * inputMag;

                // Animazione Camminata (Gambe e Braccia)
                const walkCycle = Math.sin(time * 10);
                leftLeg.rotation.x = walkCycle * 0.6;
                rightLeg.rotation.x = -walkCycle * 0.6;
                leftArm.rotation.x = -walkCycle * 0.6;
                rightArm.rotation.x = walkCycle * 0.6;
            } else {
                // Posizione di riposo
                leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, 0.1);
                rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, 0.1);
                leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0, 0.1);
                rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0, 0.1);
            }

            // Gravità e Salto
            robotPos.y += verticalVelocity;
            if (!isGrounded) {
                verticalVelocity -= 0.012;
                if (robotPos.y <= 0) {
                    robotPos.y = 0;
                    verticalVelocity = 0;
                    isGrounded = true;
                }
            }

            // Limiti Stanza (Collisioni con pareti)
            const limit = 37.5;
            robotPos.x = THREE.MathUtils.clamp(robotPos.x, -limit, limit);
            robotPos.z = THREE.MathUtils.clamp(robotPos.z, -limit, limit);

            // Aggiorna posizione modello
            robotGroup.position.copy(robotPos);
            robotGroup.rotation.y = robotRotation;

            // Aggiorna Telecamera
            if (cameraMode === 0) {
                // Terza Persona
                const camOffset = new THREE.Vector3(0, 5, 10);
                camera.position.set(robotPos.x, robotPos.y + 4, robotPos.z + 10);
                camera.lookAt(robotPos.x, robotPos.y + 2.5, robotPos.z);
            } else {
                // Prima Persona (Visore Robot)
                const headPos = new THREE.Vector3(0, 3.8, 0.2).applyQuaternion(robotGroup.quaternion);
                camera.position.copy(robotPos).add(headPos);
                
                const lookTarget = new THREE.Vector3(0, 3.8, -5).applyQuaternion(robotGroup.quaternion);
                camera.lookAt(robotPos.clone().add(lookTarget));
            }

            // HUD
            document.getElementById('posX').innerText = robotPos.x.toFixed(1);
            document.getElementById('posZ').innerText = robotPos.z.toFixed(1);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
