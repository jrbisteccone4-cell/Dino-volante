<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Shark Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #02182b; font-family: sans-serif; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top:0; left:0; z-index: 1; }

        #hud {
            position: absolute; top: 15px; left: 15px; color: #fff; font-size: 16px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10;
        }

        #status-log {
            position: absolute; top: 40px; left: 15px; color: #00ffcc; font-size: 13px;
            font-family: monospace; z-index: 10; pointer-events: none;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: #ffffff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
        }

        .btn-action {
            position: absolute; width: 75px; height: 75px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6); color: white; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center; touch-action: manipulation;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }
        .btn-action:active { transform: scale(0.9); }
        #btn-bite { bottom: 35px; right: 30px; background: rgba(220, 53, 69, 0.85); }
        #btn-dash { bottom: 125px; right: 35px; background: rgba(255, 193, 7, 0.85); color: #000; }
    </style>

    <!-- Solo libreria base Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">Punti: <span id="score">0</span> | Prede Divorate: <span id="eaten">0</span></div>
    <div id="status-log">Avvio Oceano Geometrico...</div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-dash" class="btn-action">SCATTO</div>
    <div id="btn-bite" class="btn-action">MORDI</div>

    <script>
        function log(msg) {
            document.getElementById('status-log').innerText = msg;
        }

        let scene, camera, renderer, sharkContainer, tailMesh;
        const clock = new THREE.Clock();
        const preyList = [];
        let moveInput = { x: 0, y: 0 };
        let isDashing = false;
        let score = 0, eatenCount = 0;

        function init() {
            // 1. Scena e Nebbia
            scene = new THREE.Scene();
            const oceanColor = 0x0a4b6e;
            scene.background = new THREE.Color(oceanColor);
            scene.fog = new THREE.FogExp2(oceanColor, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 2. Luci
            const ambientLight = new THREE.AmbientLight(0xdff0ff, 2.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
            sunLight.position.set(0, 100, 0);
            scene.add(sunLight);

            // 3. Creazione Ambiente e Squalo Geometrico
            createOceanFloor();
            createGeometricShark();
            createPreys();

            setupJoystick();
            setupButtons();

            log("Oceano Pronto!");
            animate();
        }

        function createGeometricShark() {
            sharkContainer = new THREE.Group();
            scene.add(sharkContainer);

            const sharkGroup = new THREE.Group();
            sharkContainer.add(sharkGroup);

            // Materiali
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x4a6984, flatShading: true, shininess: 30 });
            const bellyMat = new THREE.MeshPhongMaterial({ color: 0xdbe3ea, flatShading: true });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

            // Corpo Principale (Cono allungato)
            const bodyGeo = new THREE.ConeGeometry(1.5, 6, 8);
            bodyGeo.rotateX(Math.PI / 2);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            sharkGroup.add(body);

            // Pancia (Sfera schiacciata)
            const bellyGeo = new THREE.SphereGeometry(1.3, 8, 8);
            const belly = new THREE.Mesh(bellyGeo, bellyMat);
            belly.position.set(0, -0.3, 0.5);
            belly.scale.set(0.9, 0.6, 1.8);
            sharkGroup.add(belly);

            // Pinna Dorsale (Triangolo)
            const dorsalFinGeo = new THREE.ConeGeometry(0.5, 2, 4);
            dorsalFinGeo.rotateX(Math.PI / 4);
            const dorsalFin = new THREE.Mesh(dorsalFinGeo, bodyMat);
            dorsalFin.position.set(0, 1.5, -0.5);
            sharkGroup.add(dorsalFin);

            // Pinne Laterali
            const finGeo = new THREE.ConeGeometry(0.4, 2.5, 4);
            finGeo.rotateZ(Math.PI / 3);
            
            const leftFin = new THREE.Mesh(finGeo, bodyMat);
            leftFin.position.set(1.5, -0.3, 0.5);
            sharkGroup.add(leftFin);

            const rightFin = new THREE.Mesh(finGeo, bodyMat);
            rightFin.position.set(-1.5, -0.3, 0.5);
            rightFin.rotation.y = Math.PI;
            sharkGroup.add(rightFin);

            // Occhi
            const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(0.6, 0.3, -2.0);
            sharkGroup.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(-0.6, 0.3, -2.0);
            sharkGroup.add(rightEye);

            // Coda Snodata
            const tailGeo = new THREE.ConeGeometry(0.8, 3, 6);
            tailGeo.rotateX(-Math.PI / 2);
            tailMesh = new THREE.Mesh(tailGeo, bodyMat);
            tailMesh.position.set(0, 0, 3);
            sharkGroup.add(tailMesh);
        }

        function createOceanFloor() {
            const floorGeo = new THREE.PlaneGeometry(600, 600, 32, 32);
            const pos = floorGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setZ(i, Math.sin(pos.getX(i) * 0.05) * Math.cos(pos.getY(i) * 0.05) * 3.0);
            }
            floorGeo.computeVertexNormals();

            const floorMat = new THREE.MeshPhongMaterial({ color: 0x2c5a45, flatShading: true });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -25;
            scene.add(floor);

            // Alghe
            const weedGeo = new THREE.CylinderGeometry(0.1, 0.4, 8, 5);
            const weedMat = new THREE.MeshLambertMaterial({ color: 0x117744 });
            for (let i = 0; i < 100; i++) {
                const weed = new THREE.Mesh(weedGeo, weedMat);
                weed.position.set((Math.random() - 0.5) * 400, -21, (Math.random() - 0.5) * 400);
                scene.add(weed);
            }
        }

        function createPreys() {
            const preyGeo = new THREE.ConeGeometry(0.5, 1.8, 6);
            preyGeo.rotateX(Math.PI / 2);

            for (let i = 0; i < 60; i++) {
                const mat = new THREE.MeshPhongMaterial({ color: 0xffaa00, flatShading: true });
                const fish = new THREE.Mesh(preyGeo, mat);
                fish.position.set(
                    (Math.random() - 0.5) * 250,
                    Math.random() * 30 - 10,
                    (Math.random() - 0.5) * 250
                );
                fish.userData = { speed: Math.random() * 0.12 + 0.06 };
                scene.add(fish);
                preyList.push(fish);
            }
        }

        function setupJoystick() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let active = false, center = { x: 0, y: 0 }, touchId = null;

            function start(e) {
                if (active) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                if (e.changedTouches) touchId = touch.identifier;
                const rect = container.getBoundingClientRect();
                center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                active = true;
                move(e);
            }

            function move(e) {
                if (!active) return;
                let touch = null;
                if (e.touches) {
                    for (let i = 0; i < e.touches.length; i++) {
                        if (e.touches[i].identifier === touchId) { touch = e.touches[i]; break; }
                    }
                    if (!touch) return;
                } else { touch = e; }

                const dx = touch.clientX - center.x;
                const dy = touch.clientY - center.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                moveInput.x = (Math.cos(angle) * dist) / maxDist;
                moveInput.y = (Math.sin(angle) * dist) / maxDist;
            }

            function end() {
                if (!active) return;
                active = false; touchId = null;
                knob.style.transform = `translate(0px, 0px)`;
                moveInput = { x: 0, y: 0 };
            }

            container.addEventListener('touchstart', start, { passive: false });
            window.addEventListener('touchmove', move, { passive: false });
            window.addEventListener('touchend', end);
            container.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
        }

        function setupButtons() {
            document.getElementById('btn-dash').addEventListener('click', () => {
                if (isDashing) return;
                isDashing = true;
                setTimeout(() => isDashing = false, 1200);
            });

            document.getElementById('btn-bite').addEventListener('click', () => {
                const sharkPos = sharkContainer.position;
                for (let i = preyList.length - 1; i >= 0; i--) {
                    const prey = preyList[i];
                    if (prey.position.distanceTo(sharkPos) < 10.0) {
                        scene.remove(prey);
                        preyList.splice(i, 1);
                        score += 100;
                        eatenCount++;
                        document.getElementById('score').innerText = score;
                        document.getElementById('eaten').innerText = eatenCount;
                    }
                }
            });
        }

        let targetPitch = 0, targetYaw = 0, currentPitch = 0, currentYaw = 0;

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Movimento coda squalo
            if (tailMesh) {
                tailMesh.rotation.y = Math.sin(time * 6) * 0.3;
            }

            const speed = isDashing ? 0.5 : 0.22;

            if (Math.hypot(moveInput.x, moveInput.y) > 0.05) {
                targetYaw -= moveInput.x * 0.035;
                targetPitch = THREE.MathUtils.clamp(targetPitch - moveInput.y * 0.025, -0.5, 0.5);
            } else {
                targetPitch = THREE.MathUtils.lerp(targetPitch, 0, 0.03);
            }

            currentYaw = THREE.MathUtils.lerp(currentYaw, targetYaw, 0.08);
            currentPitch = THREE.MathUtils.lerp(currentPitch, targetPitch, 0.08);

            sharkContainer.rotation.identity();
            sharkContainer.rotation.y = currentYaw;
            sharkContainer.rotateX(currentPitch);

            const moveDir = new THREE.Vector3(0, 0, -1).applyQuaternion(sharkContainer.quaternion);
            sharkContainer.position.addScaledVector(moveDir, speed);
            sharkContainer.position.y = THREE.MathUtils.clamp(sharkContainer.position.y, -20, 15);

            // Inquadratura telecamera
            const offset = new THREE.Vector3(0, 3.5, 14).applyQuaternion(sharkContainer.quaternion);
            camera.position.copy(sharkContainer.position).add(offset);
            camera.lookAt(sharkContainer.position.clone().add(new THREE.Vector3(0, 1, 0)));

            // Movimento pesci
            preyList.forEach(prey => prey.translateZ(prey.userData.speed));

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
