<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Game - Mani in Prima Persona</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0a0a0a; font-family: sans-serif; position: fixed; }
        canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 1; }

        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 99999;
            color: white; transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.2);
            border-top: 5px solid #00ffcc; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-text { font-size: 14px; font-family: monospace; font-weight: bold; color: #00ffcc; letter-spacing: 1px; }

        #hud {
            position: absolute; top: 80px; left: 15px; color: #222; font-size: 13px; font-weight: bold;
            font-family: monospace; pointer-events: none; z-index: 10; background: rgba(255,255,255,0.9);
            padding: 8px 12px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        #status-log {
            position: absolute; top: 130px; left: 15px; color: #00ffcc; font-size: 12px;
            font-family: monospace; pointer-events: none; z-index: 10; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 8px 12px; border-radius: 4px; max-width: 90vw;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 20px; width: 120px; height: 120px;
            background: rgba(0, 0, 0, 0.35); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 37px; left: 37px; width: 46px; height: 46px;
            background: #222; border: 2px solid #fff; border-radius: 50%; pointer-events: none;
        }

        .btn-action {
            position: absolute; width: 68px; height: 68px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6); color: white; font-weight: bold; font-size: 11px;
            display: flex; align-items: center; justify-content: center; touch-action: none;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; text-align: center;
        }
        .btn-action:active { transform: scale(0.9); }
        #btn-jump { bottom: 30px; right: 20px; background: #28a745; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">CARICAMENTO GIOCO...</div>
    </div>

    <div id="hud">
        STATO: <span id="status-text">CARICAMENTO</span><br>
        POS: X:<span id="posX">8.0</span> Y:<span id="posY">0</span> Z:<span id="posZ">0</span>
    </div>
    <div id="status-log">Inizializzazione...</div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-jump" class="btn-action">INTERAGISCI</div>

    <script>
        function log(msg) { 
            console.log(msg);
            document.getElementById('status-log').innerText = msg; 
        }

        let scene, camera, renderer, handsMesh, mapMesh;
        let mixer = null;
        let actionAnim = null;

        const clock = new THREE.Clock();
        let moveInput = { x: 0, y: 0 };
        let playerPos = new THREE.Vector3(8.0, 0, 0);
        let cameraYaw = 0;
        let cameraPitch = 0;
        let isMapLoaded = false;
        let isHandsLoaded = false;

        const raycaster = new THREE.Raycaster();
        let collidableObjects = [];

        function checkEverythingLoaded() {
            if (isMapLoaded && isHandsLoaded) {
                const loaderScreen = document.getElementById('loading-screen');
                loaderScreen.style.opacity = '0';
                setTimeout(() => { loaderScreen.style.display = 'none'; }, 500);
                document.getElementById('status-text').innerText = "PRONTO";
                log("Mani posizionate in basso correttamente!");
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); 
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
            mainLight.position.set(10, 30, 10);
            scene.add(mainLight);

            loadHands();
            loadMap();
            setupControls();

            animate();
        }

        function loadMap() {
            log("Caricamento mappa.glb...");
            const loader = new THREE.GLTFLoader();

            loader.load('mappa.glb', (gltf) => {
                mapMesh = gltf.scene;
                collidableObjects = [];
                scene.add(mapMesh);

                mapMesh.traverse((child) => {
                    if (child.isMesh) {
                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                        }
                        collidableObjects.push(child);
                    }
                });

                playerPos.set(8.0, 0, 0); 
                isMapLoaded = true; 
                log("Mappa caricata.");
                checkEverythingLoaded();
            }, (xhr) => {
                if (xhr.total) {
                    const pct = Math.floor((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading-text').innerText = `MAPPA: ${pct}%`;
                }
            }, (error) => {
                log("Errore caricamento mappa.glb");
                console.error(error);
            });
        }

        function loadHands() {
            log("Caricamento personaggio.glb (mani)...");
            const loader = new THREE.GLTFLoader();

            loader.load('personaggio.glb', (gltf) => {
                handsMesh = gltf.scene;

                camera.add(handsMesh);
                
                // Spostate drasticamente in basso (Y: -1.8) e in avanti (Z: -0.8) 
                // così restano confinate nella parte inferiore dello schermo senza tagliare i polsi
                handsMesh.position.set(0, -1.8, -0.8);
                handsMesh.rotation.set(0, 0, 0); 
                handsMesh.scale.set(0.6, 0.6, 0.6);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(handsMesh);
                    actionAnim = mixer.clipAction(gltf.animations[0]);
                    actionAnim.setLoop(THREE.LoopRepeat);
                    actionAnim.play();
                }

                isHandsLoaded = true;
                log("Mani caricate.");
                checkEverythingLoaded();
            }, (xhr) => {
                if (xhr.total) {
                    const pct = Math.floor((xhr.loaded / xhr.total) * 100);
                    document.getElementById('loading-text').innerText = `MANI: ${pct}%`;
                }
            }, (error) => {
                log("Errore caricamento personaggio.glb");
                console.error(error);
            });
        }

        function setupControls() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let joystickTouchId = null;
            let cameraTouchId = null;
            let joystickCenter = { x: 0, y: 0 };
            let lastTouchPos = { x: 0, y: 0 };

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const rect = container.getBoundingClientRect();

                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        if (joystickTouchId === null) {
                            joystickTouchId = touch.identifier;
                            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                            updateJoystick(touch);
                        }
                    } else if (touch.clientX > window.innerWidth / 3 && cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];

                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === cameraTouchId) {
                        const dx = touch.clientX - lastTouchPos.x;
                        const dy = touch.clientY - lastTouchPos.y;

                        cameraYaw -= dx * 0.004;
                        cameraPitch = Math.max(-0.6, Math.min(0.6, cameraPitch + dy * 0.004));

                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            const stopTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        moveInput = { x: 0, y: 0 };
                    }
                    if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', stopTouch);
            window.addEventListener('touchcancel', stopTouch);

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                
                moveInput.x = (dx / maxDist);
                moveInput.y = (dy / maxDist);
            }

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                log("Interazione avviata!");
            }, { passive: false });
        }

        function canMoveTo(targetPos) {
            if (collidableObjects.length === 0) return true;
            const origin = targetPos.clone();
            origin.y += 0.4;
            const directions = [
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-1, 0, 0),
                new THREE.Vector3(0, 0, 1),
                new THREE.Vector3(0, 0, -1)
            ];
            for (let dir of directions) {
                raycaster.set(origin, dir);
                const hits = raycaster.intersectObjects(collidableObjects, true);
                if (hits.length > 0 && hits[0].distance < 0.3) return false;
            }
            return true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const inputMag = Math.hypot(moveInput.x, moveInput.y);
            
            if (isMapLoaded && isHandsLoaded) {
                if (inputMag > 0.05) {
                    const currentSpeed = 0.03 * inputMag;
                    const moveAngle = Math.atan2(-moveInput.x, -moveInput.y) + cameraYaw;

                    const moveDir = new THREE.Vector3(
                        Math.sin(moveAngle) * currentSpeed,
                        0,
                        Math.cos(moveAngle) * currentSpeed
                    );

                    let nextX = playerPos.clone();
                    nextX.x += moveDir.x;
                    if (canMoveTo(nextX)) playerPos.x = nextX.x;

                    let nextZ = playerPos.clone();
                    nextZ.z += moveDir.z;
                    if (canMoveTo(nextZ)) playerPos.z = nextZ.z;

                    if (actionAnim) actionAnim.timeScale = 1.2;
                } else {
                    if (actionAnim) actionAnim.timeScale = 0.5;
                }
            }

            if (mixer) mixer.update(delta);

            camera.position.set(playerPos.x, playerPos.y + 0.8, playerPos.z);
            
            const lookTarget = new THREE.Vector3(
                playerPos.x + Math.sin(cameraYaw) * 5,
                playerPos.y + 0.8 - cameraPitch * 5,
                playerPos.z + Math.cos(cameraYaw) * 5
            );
            camera.lookAt(lookTarget);

            if (!camera.parent && scene) {
                scene.add(camera);
            }

            document.getElementById('posX').innerText = playerPos.x.toFixed(1);
            document.getElementById('posY').innerText = playerPos.y.toFixed(1);
            document.getElementById('posZ').innerText = playerPos.z.toFixed(1);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
