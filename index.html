<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Game - Singola Mappa Ottimizzata</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; position: fixed; }
        canvas { display: block; width: 100%; height: 100%; position: fixed; top: 0; left: 0; z-index: 1; }

        #hud {
            position: absolute; top: 15px; left: 15px; color: #222; font-size: 12px; font-weight: bold;
            font-family: monospace; pointer-events: none; z-index: 10; background: rgba(255,255,255,0.85);
            padding: 6px 10px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        #status-log {
            position: absolute; top: 65px; left: 15px; color: #00ffcc; font-size: 11px;
            font-family: monospace; pointer-events: none; z-index: 10; font-weight: bold;
            background: rgba(0,0,0,0.85); padding: 6px 10px; border-radius: 4px; max-width: 90vw;
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 20px; width: 120px; height: 120px;
            background: rgba(0, 0, 0, 0.25); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 37px; left: 37px; width: 46px; height: 46px;
            background: #222; border: 2px solid #fff; border-radius: 50%;
            pointer-events: none;
        }

        .btn-action {
            position: absolute; width: 68px; height: 68px; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6); color: white; font-weight: bold; font-size: 11px;
            display: flex; align-items: center; justify-content: center; touch-action: none;
            z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; text-align: center;
        }
        .btn-action:active { transform: scale(0.9); }
        #btn-cam { bottom: 30px; right: 20px; background: #007acc; }
        #btn-jump { bottom: 110px; right: 20px; background: #28a745; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="hud">
        STATO: <span id="status-text">AVVIO...</span><br>
        POS: X:<span id="posX">0</span> Y:<span id="posY">0</span> Z:<span id="posZ">0</span>
    </div>
    <div id="status-log">Inizializzazione mappa...</div>

    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="btn-jump" class="btn-action">SALTA</div>
    <div id="btn-cam" class="btn-action">VISTA</div>

    <script>
        function log(msg) { 
            console.log(msg);
            document.getElementById('status-log').innerText = msg; 
        }

        let scene, camera, renderer, playerGroup, characterMesh, mapMesh;
        let mixer = null;
        let walkAction = null;

        const clock = new THREE.Clock();
        let moveInput = { x: 0, y: 0 };
        let playerPos = new THREE.Vector3(8.0, 0, 0); // Spawn impostato a X: 8.0
        let playerRotation = 0;
        let cameraYaw = 0;
        let cameraPitch = 0.15;
        let isMapLoaded = false;
        let cameraMode = 0;

        const raycaster = new THREE.Raycaster();
        let collidableObjects = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.FogExp2(0x0a0a0a, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.body.appendChild(renderer.domElement);

            // Illuminazione bilanciata per valorizzare i colori della pelle e dell'ambiente
            const ambientLight = new THREE.AmbientLight(0xfff5ec, 1.4);
            scene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.9);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const mainLight = new THREE.DirectionalLight(0xfff3e0, 1.1);
            mainLight.position.set(10, 30, 10);
            scene.add(mainLight);

            loadCharacter();
            loadMap();
            setupControls();

            animate();
        }

        function loadMap() {
            isMapLoaded = false; 
            log("Caricamento mappa.glb...");
            document.getElementById('status-text').innerText = "CARICAMENTO";

            const loader = new THREE.GLTFLoader();

            loader.load('mappa.glb', (gltf) => {
                try {
                    if (mapMesh) scene.remove(mapMesh);

                    mapMesh = gltf.scene;
                    collidableObjects = [];
                    scene.add(mapMesh);

                    mapMesh.traverse((child) => {
                        if (child.isMesh) {
                            if (child.material) {
                                child.material.side = THREE.DoubleSide;
                                child.material.roughness = 0.8;
                                child.material.metalness = 0.1;
                            }
                            collidableObjects.push(child);
                        }
                    });

                    playerPos.set(8.0, 0, 0); // Posizione di spawn iniziale precisa
                    isMapLoaded = true; 
                    document.getElementById('status-text').innerText = "PRONTO";
                    log("Mappa caricata con successo!");
                } catch (err) {
                    log("Errore script: " + err.message);
                    console.error(err);
                }
            }, undefined, (error) => {
                log("Errore: mappa.glb non trovato!");
                console.error(error);
            });
        }

        function loadCharacter() {
            playerGroup = new THREE.Group();
            scene.add(playerGroup);

            const loader = new THREE.GLTFLoader();
            loader.load('personaggio.glb', (gltf) => {
                characterMesh = gltf.scene;

                characterMesh.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = false; 
                        child.receiveShadow = false;
                        if (child.material) {
                            // Corregge l'incarnato troppo bianco/cadaverico dando una tonalità calda e umana
                            if (child.material.color) {
                                let col = child.material.color;
                                if (col.r > 0.75 && col.g > 0.75 && col.b > 0.75) {
                                    child.material.color.setHex(0xffdfc4); // Tonalità pelle calda
                                }
                            }
                            child.material.roughness = 0.5;
                            child.material.metalness = 0.1;
                            child.material.needsUpdate = true;
                        }
                    }
                });

                const box = new THREE.Box3().setFromObject(characterMesh);
                const size = box.getSize(new THREE.Vector3());
                const targetHeight = 1.15; 
                const scaleFactor = targetHeight / (size.y || 1);
                characterMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);

                // Ancoraggio millimetrico dei piedi esattamente sul pavimento (Y = 0)
                const updatedBox = new THREE.Box3().setFromObject(characterMesh);
                characterMesh.position.y = -updatedBox.min.y;

                playerGroup.add(characterMesh);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(characterMesh);
                    walkAction = mixer.clipAction(gltf.animations[0]);
                    walkAction.setLoop(THREE.LoopRepeat);
                    walkAction.stop(); // Fermo all'avvio per evitare fluttuazioni statiche
                    log("Personaggio pronto!");
                } else {
                    log("Personaggio pronto (senza animazioni)");
                }
            }, undefined, (error) => {
                log("Errore: personaggio.glb non trovato!");
                console.error(error);
            });
        }

        function setupControls() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            let joystickTouchId = null;
            let cameraTouchId = null;
            let joystickCenter = { x: 0, y: 0 };
            let lastTouchPos = { x: 0, y: 0 };

            window.addEventListener('touchstart', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    const rect = container.getBoundingClientRect();

                    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                        touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        if (joystickTouchId === null) {
                            joystickTouchId = touch.identifier;
                            joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                            updateJoystick(touch);
                        }
                    } else if (touch.clientX > window.innerWidth / 3 && cameraTouchId === null) {
                        cameraTouchId = touch.identifier;
                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];

                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === cameraTouchId) {
                        const dx = touch.clientX - lastTouchPos.x;
                        const dy = touch.clientY - lastTouchPos.y;

                        cameraYaw -= dx * 0.004;
                        cameraPitch = Math.max(-0.3, Math.min(0.6, cameraPitch + dy * 0.004));

                        lastTouchPos = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, { passive: false });

            const stopTouch = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        knob.style.transform = `translate(0px, 0px)`;
                        moveInput = { x: 0, y: 0 };
                    }
                    if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            };

            window.addEventListener('touchend', stopTouch);
            window.addEventListener('touchcancel', stopTouch);

            function updateJoystick(touch) {
                const dx = touch.clientX - joystickCenter.x;
                const dy = touch.clientY - joystickCenter.y;
                const maxDist = 40;
                const dist = Math.min(Math.hypot(dx, dy), maxDist);
                const angle = Math.atan2(dy, dx);

                knob.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                
                moveInput.x = (dx / maxDist);
                moveInput.y = (dy / maxDist);
            }

            document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
            }, { passive: false });

            document.getElementById('btn-cam').addEventListener('touchstart', (e) => {
                e.preventDefault();
                cameraMode = (cameraMode + 1) % 2;
            }, { passive: false });
        }

        function canMoveTo(targetPos) {
            if (collidableObjects.length === 0) return true;

            const origin = targetPos.clone();
            origin.y += 0.4;

            const directions = [
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-1, 0, 0),
                new THREE.Vector3(0, 0, 1),
                new THREE.Vector3(0, 0, -1)
            ];

            for (let dir of directions) {
                raycaster.set(origin, dir);
                const hits = raycaster.intersectObjects(collidableObjects, true);
                if (hits.length > 0 && hits[0].distance < 0.3) {
                    return false;
                }
            }
            return true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            const inputMag = Math.hypot(moveInput.x, moveInput.y);
            const speed = 0.04; 

            if (isMapLoaded && inputMag > 0.1) {
                const moveAngle = Math.atan2(-moveInput.x, -moveInput.y) + cameraYaw;
                playerRotation = moveAngle;

                const moveDir = new THREE.Vector3(
                    Math.sin(moveAngle) * speed * inputMag,
                    0,
                    Math.cos(moveAngle) * speed * inputMag
                );

                let nextX = playerPos.clone();
                nextX.x += moveDir.x;
                if (canMoveTo(nextX)) playerPos.x = nextX.x;

                let nextZ = playerPos.clone();
                nextZ.z += moveDir.z;
                if (canMoveTo(nextZ)) playerPos.z = nextZ.z;

                if (walkAction && !walkAction.isRunning()) {
                    walkAction.play();
                }
            } else {
                if (walkAction && walkAction.isRunning()) {
                    walkAction.stop();
                }
            }

            if (mixer) mixer.update(delta);

            if (playerGroup) {
                playerGroup.position.copy(playerPos);
                playerGroup.rotation.y = playerRotation;
            }

            if (cameraMode === 0) {
                const targetDist = 2.5;
                const headPos = playerPos.clone().add(new THREE.Vector3(0, 0.8, 0));
                
                const camDir = new THREE.Vector3(
                    -Math.sin(cameraYaw) * Math.cos(cameraPitch),
                    Math.sin(cameraPitch),
                    -Math.cos(cameraYaw) * Math.cos(cameraPitch)
                ).normalize();

                raycaster.set(headPos, camDir);
                const camHits = raycaster.intersectObjects(collidableObjects, true);

                let actualDist = targetDist;
                if (camHits.length > 0 && camHits[0].distance < targetDist) {
                    actualDist = Math.max(0.3, camHits[0].distance - 0.1);
                }

                camera.position.copy(headPos).add(camDir.multiplyScalar(actualDist));
                camera.lookAt(playerPos.x, playerPos.y + 0.8, playerPos.z);
            } else {
                camera.position.set(playerPos.x, playerPos.y + 0.85, playerPos.z);
                const lookTarget = new THREE.Vector3(
                    playerPos.x + Math.sin(cameraYaw) * 5,
                    playerPos.y + 0.85 - Math.sin(cameraPitch) * 5,
                    playerPos.z + Math.cos(cameraYaw) * 5
                );
                camera.lookAt(lookTarget);
            }

            document.getElementById('posX').innerText = playerPos.x.toFixed(1);
            document.getElementById('posY').innerText = playerPos.y.toFixed(1);
            document.getElementById('posZ').innerText = playerPos.z.toFixed(1);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
