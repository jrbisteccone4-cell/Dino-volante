<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino-volante - Modello 3D</title>
    <!-- Importa lo script di Model Viewer per visualizzare i file .glb -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        p {
            color: #8b949e;
            font-size: 1rem;
        }

        .viewer-container {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #161b22;
        }

        footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dino-volante</h1>
        <p>Visualizzatore interattivo del personaggio 3D</p>
    </header>

    <div class="viewer-container">
        <!-- Inserisci il file .glb nella stessa cartella -->
        <model-viewer 
            src="personaggio.glb" 
            alt="Personaggio Dino-volante 3D" 
            auto-rotate 
            camera-controls 
            shadow-intensity="1">
        </model-viewer>
    </div>

    <footer>
        <p>Creato con GitHub Pages</p>
    </footer>

</body>
</html>
