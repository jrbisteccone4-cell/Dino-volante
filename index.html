<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRBISTECCONE17 | Gaming & Streaming Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --surface-dark: #13151f;
            --surface-card: #1b1e2e;
            --neon-cyan: #00f0ff;
            --neon-purple: #9d00ff;
            --accent-pink: #ff007f;
            --text-main: #f0f2f5;
            --text-muted: #8b9bb4;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            line-height: 1.6;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* Header & Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--text-main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 8rem 2rem 4rem;
            max-width: 1300px;
            margin: 0 auto;
            gap: 4rem;
        }

        .hero-content {
            flex: 1.2;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid var(--accent-pink);
            color: var(--accent-pink);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .pulsing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-pink);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hero h1 {
            font-size: clamp(2.5rem, 4.5vw, 4.2rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .hero h1 span {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 600px;
        }

        .btn-group {
            display: flex;
            gap: 1.2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 2.2rem;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: var(--transition);
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: var(--bg-dark);
            border: none;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
        }

        .hero-banner {
            flex: 1;
            height: 420px;
            background: linear-gradient(145deg, var(--surface-card), var(--surface-dark));
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-glow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--neon-cyan);
            filter: blur(80px);
            opacity: 0.2;
            top: 20%;
            left: 30%;
        }

        .stream-preview-text {
            text-align: center;
            z-index: 2;
        }

        .stream-preview-text h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--neon-cyan);
        }

        .stream-preview-text p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Stats & Setup Section */
        .stats-section {
            background-color: var(--surface-dark);
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 4rem 2rem;
        }

        .stats-container {
            max-width: 1300px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            text-align: center;
        }

        .stat-card {
            background-color: var(--surface-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .stat-card h3 {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Games / Content Section */
        .content-section {
            padding: 7rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .section-desc {
            color: var(--text-muted);
            margin-bottom: 3rem;
        }
