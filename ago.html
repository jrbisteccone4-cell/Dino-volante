<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cerca l'Ago nel Pagliaio 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #1a140d; font-family: sans-serif; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.8); color: white; text-align: center; padding: 20px; z-index: 10;
    }
    h1 { font-size: 1.8rem; color: #fbc02d; margin-bottom: 10px; }
    p { font-size: 1rem; line-height: 1.4; margin-bottom: 25px; color: #ddd; }
    button {
      padding: 18px 45px; font-size: 1.2rem; font-weight: bold; border: none;
      border-radius: 30px; background: #fbc02d; color: #1a140d; cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 192, 45, 0.4); -webkit-tap-highlight-color: transparent;
    }
    #ui {
      position: absolute; top: 15px; left: 15px; color: #fff; font-weight: bold;
      font-size: 1.1rem; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); pointer-events: none; z-index: 5;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">Tempo: <span id="timer">0</span>s</div>

  <div id="overlay">
    <h1 id="title">L'Ago nel Pagliaio 3D 🪡</h1>
    <p>Trascina il dito sullo schermo per muovere la lente di ingrandimento.<br><br>Trova e tocca l'ago di metallo nascosto nel fieno!</p>
    <button id="startBtn">INIZIA LA RICERCA</button>
  </div>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a140d);
scene.fog = new THREE.FogExp2(0x1a140d, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 25, 15);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xfff5e6, 0.8);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffe0b2, 1.2);
dirLight.position.set(20, 40, 20);
scene.add(dirLight);

// Terreno
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Pagliaio (Fieno 3D)
const strawCount = 40000;
const strawGeo = new THREE.CylinderGeometry(0.02, 0.08, 3, 3);
strawGeo.translate(0, 1.5, 0);
const strawMat = new THREE.MeshStandardMaterial({ color: 0xd4a359, roughness: 0.6 });
const strawInstanced = new THREE.InstancedMesh(strawGeo, strawMat, strawCount);

const dummy = new THREE.Object3D();
const fieldSize = 35;

for (let i = 0; i < strawCount; i++) {
  dummy.position.set(
    (Math.random() - 0.5) * fieldSize,
    0,
    (Math.random() - 0.5) * fieldSize
  );
  dummy.rotation.set(
    (Math.random() - 0.5) * 0.4,
    Math.random() * Math.PI,
    (Math.random() - 0.5) * 0.4
  );
  const scale = 0.8 + Math.random() * 0.5;
  dummy.scale.set(scale, scale, scale);
  dummy.updateMatrix();
  strawInstanced.setMatrixAt(i, dummy.matrix);
}
scene.add(strawInstanced);

// Ago lucido 3D
const needleGroup = new THREE.Group();
const needleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1.0, roughness: 0.1 });
const needleMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.02, 4, 16), needleMat);
needleMesh.rotation.z = Math.PI / 2;
needleGroup.add(needleMesh);

const eyeMesh = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 8, 16), needleMat);
eyeMesh.position.x = -2;
needleGroup.add(eyeMesh);

const needlePos = new THREE.Vector3(
  (Math.random() - 0.5) * (fieldSize - 8),
  0.2,
  (Math.random() - 0.5) * (fieldSize - 8)
);
needleGroup.position.copy(needlePos);
needleGroup.rotation.y = Math.random() * Math.PI;
scene.add(needleGroup);

// Lente d'Ingrandimento
const lensGroup = new THREE.Group();
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(2.5, 0.15, 16, 64),
  new THREE.MeshStandardMaterial({ color: 0xb8860b, metalness: 0.8, roughness: 0.2 })
);
ring.rotation.x = Math.PI / 2;
lensGroup.add(ring);

const handle = new THREE.Mesh(
  new THREE.CylinderGeometry(0.2, 0.2, 3, 16),
  new THREE.MeshStandardMaterial({ color: 0x4a2e16, roughness: 0.7 })
);
handle.position.set(0, 0, 3.8);
handle.rotation.x = Math.PI / 2;
lensGroup.add(handle);

scene.add(lensGroup);
lensGroup.position.set(0, 6, 0);

let gameActive = false;
let startTime = 0;
let timerInterval = null;
const raycaster = new THREE.Raycaster();
const touchPos = new THREE.Vector2();
const targetLensPos = new THREE.Vector3(0, 6, 0);

// Controlli Touch Mobile
window.addEventListener('touchmove', (e) => {
  if (!gameActive) return;
  const touch = e.touches[0];
  touchPos.x = (touch.clientX / window.innerWidth) * 2 - 1;
  touchPos.y = -(touch.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(touchPos, camera);
  const targetPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -4);
  const intersectPoint = new THREE.Vector3();
  raycaster.ray.intersectPlane(targetPlane, intersectPoint);

  if (intersectPoint) {
    targetLensPos.copy(intersectPoint);
  }
}, { passive: false });

window.addEventListener('touchstart', (e) => {
  if (!gameActive) return;
  const touch = e.touches[0];
  const clickCoords = new THREE.Vector2(
    (touch.clientX / window.innerWidth) * 2 - 1,
    -(touch.clientY / window.innerHeight) * 2 + 1
  );
  
  raycaster.setFromCamera(clickCoords, camera);
  const intersects = raycaster.intersectObject(needleMesh);

  if (intersects.length > 0) {
    winGame();
  }
});

const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('touchend', initGame);
startBtn.addEventListener('click', initGame);

function initGame(e) {
  if (e) e.preventDefault();
  gameActive = true;
  document.getElementById('overlay').style.display = 'none';
  startTime = Date.now();
  
  timerInterval = setInterval(() => {
    document.getElementById('timer').innerText = Math.floor((Date.now() - startTime) / 1000);
  }, 1000);
  
  animate();
}

function animate() {
  if (!gameActive) return;
  requestAnimationFrame(animate);

  lensGroup.position.lerp(targetLensPos, 0.2);
  
  const distanceToNeedle = lensGroup.position.distanceTo(
    new THREE.Vector3(needleGroup.position.x, lensGroup.position.y, needleGroup.position.z)
  );

  if (distanceToNeedle < 4) {
    needleMat.emissive.setHex(0xaaaaaa);
  } else {
    needleMat.emissive.setHex(0x000000);
  }

  camera.position.x = lensGroup.position.x * 0.3;
  camera.position.z = 15 + lensGroup.position.z * 0.3;
  camera.lookAt(lensGroup.position.x * 0.2, 0, lensGroup.position.z * 0.2);

  renderer.render(scene, camera);
}

function winGame() {
  gameActive = false;
  clearInterval(timerInterval);
  const finalTime = Math.floor((Date.now() - startTime) / 1000);
  
  needleGroup.position.y = 3;
  needleGroup.scale.set(1.8, 1.8, 1.8);
  renderer.render(scene, camera);

  document.getElementById('title').innerText = 'TROVATO! 🪡✨';
  document.getElementById('overlay').querySelector('p').innerHTML = `Hai trovato l'ago in <b>${finalTime} secondi</b>!`;
  startBtn.innerText = 'GIOCA ANCORA';
  startBtn.onclick = () => location.reload();
  document.getElementById('overlay').style.display = 'flex';
}
</script>
</body>
</html>
