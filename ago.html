<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haystack Needle 3D: Ultimate Search</title>
  <style>
    * { box-sizing: border-box; touch-action: none; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    /* Overlay Introduzione */
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(15, 23, 42, 0.95); color: white; text-align: center; padding: 25px; z-index: 100;
    }
    h1 { font-size: 2.2rem; margin-bottom: 10px; color: #f59e0b; text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
    p { font-size: 1rem; color: #cbd5e1; line-height: 1.6; max-width: 80%; margin-bottom: 25px; }
    button {
      padding: 16px 40px; font-size: 1.2rem; font-weight: bold; border: none;
      border-radius: 50px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4); cursor: pointer;
    }

    /* Interfaccia HUD */
    #hud { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; }
    .counter { background: rgba(0,0,0,0.6); padding: 10px 18px; border-radius: 20px; color: #fff; font-weight: bold; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.2); }
    
    /* Notifica 30s */
    #napoli-banner {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      background: linear-gradient(135deg, #0080ff, #0059b3); color: white; padding: 12px 20px;
      border-radius: 12px; font-weight: bold; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: none; border: 2px solid #fff; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    /* Joystick di movimento (Sinistra) */
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border-radius: 50%; z-index: 10; border: 2px solid rgba(255,255,255,0.3); }
    #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #ffffff; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }

    /* Pulsante Lente (Destra) */
    #lens-btn {
      position: absolute; bottom: 40px; right: 35px; width: 75px; height: 75px;
      background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      font-size: 2.2rem; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #lens-btn.active { background: rgba(245, 158, 11, 0.8); border-color: #fff; }

    /* Overlay Lente di Ingrandimento 4x */
    #magnifier-overlay {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 280px; height: 280px; border-radius: 50%; border: 8px solid #333;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,0,0,0.5);
      pointer-events: none; display: none; z-index: 5;
    }

    /* Lente 3d visibile in mano a destra */
    #hand-lens { position: absolute; bottom: 0; right: 0; width: 220px; pointer-events: none; z-index: 4; display: block; }
  </style>

  <!-- Import Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Tone.js per Musica e Audio Rilassante Generativo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

  <div id="overlay">
    <h1>HAYSTACK NEEDLE 3D</h1>
    <p>1.000.000 di fili di fieno ti separano dall'obiettivo.<br>Esplora il campo con la lente 4x, sposta un filo alla volta e scova l'ago argentato.</p>
    <button id="start-btn">INIZIA LA SFIDA</button>
  </div>

  <div id="hud">
    <div class="counter">Fili rimossi: <span id="count">0</span></div>
  </div>

  <div id="napoli-banner">sei un napolecanaccio</div>
  <div id="magnifier-overlay"></div>
  
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="lens-btn">🔎</div>

  <!-- SVG della Lente tenuta in mano a destra -->
  <svg id="hand-lens" viewBox="0 0 200 200">
    <path d="M 120 120 L 180 180" stroke="#4a3525" stroke-width="16" stroke-linecap="round"/>
    <circle cx="90" cy="90" r="55" fill="rgba(255,255,255,0.1)" stroke="#d4af37" stroke-width="8"/>
    <circle cx="90" cy="90" r="50" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  </svg>

  <div id="canvas-container"></div>

<script>
// --- LOGICA DI GIOCO 3D ---
let scene, camera, renderer;
let strawMesh, needleMesh;
let removedCount = 0;
let isLensActive = false;
const TOTAL_STRAWS = 1000000;
const FIELD_SIZE = 120; // Campo vasto per muoversi agevolmente

// Posizione ago nascosto
const needlePos = new THREE.Vector3(
  (Math.random() - 0.5) * (FIELD_SIZE * 0.6),
  0.15,
  (Math.random() - 0.5) * (FIELD_SIZE * 0.6)
);

// Controlli
let joystickActive = false;
let joyStart = { x: 0, y: 0 };
let moveVector = { x: 0, y: 0 };
let isRotating = false;
let previousTouch = { x: 0, y: 0 };
const rotationSensitivity = 0.002; // Sensibilità di rotazione bassa e controllata

// Dati istanze fieno (Posizione, Matrice)
const strawPositions = [];
const dummy = new THREE.Object3D();

function init3D() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2.5, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Luci ambientali quasi-realistiche
  const ambientLight = new THREE.AmbientLight(0xfff5ea, 0.7);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
  sunLight.position.set(50, 80, 30);
  sunLight.castShadow = true;
  scene.add(sunLight);

  // Terreno
  const groundGeo = new THREE.PlaneGeometry(FIELD_SIZE * 2, FIELD_SIZE * 2);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a2817, roughness: 0.9 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Generazione di 1 MILIONE di fili di fieno densi e attaccati
  const strawGeo = new THREE.CylinderGeometry(0.015, 0.025, 0.7, 3);
  const strawMat = new THREE.MeshStandardMaterial({ color: 0xd4a341, roughness: 0.6 });
  strawMesh = new THREE.InstancedMesh(strawGeo, strawMat, TOTAL_STRAWS);

  for (let i = 0; i < TOTAL_STRAWS; i++) {
    const x = (Math.random() - 0.5) * FIELD_SIZE;
    const z = (Math.random() - 0.5) * FIELD_SIZE;
    const y = 0.35;

    dummy.position.set(x, y, z);
    dummy.rotation.set((Math.random() - 0.5) * 0.4, Math.random() * Math.PI, (Math.random() - 0.5) * 0.4);
    dummy.scale.set(1, 0.8 + Math.random() * 0.4, 1);
    dummy.updateMatrix();

    strawMesh.setMatrixAt(i, dummy.matrix);
    strawPositions.push({ x, y, z, active: true });
  }
  scene.add(strawMesh);

  // Creazione Ago Argentato 3D
  const needleGeo = new THREE.CylinderGeometry(0.012, 0.002, 0.9, 8);
  const needleMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.95, roughness: 0.1 });
  needleMesh = new THREE.Mesh(needleGeo, needleMat);
  needleMesh.position.copy(needlePos);
  needleMesh.rotation.z = Math.PI / 2.2;
  scene.add(needleMesh);

  // Ridimensionamento finestra
  window.addEventListener('resize', onWindowResize);
}

// --- GESTIONE CONTROLLI TOUCH & JOYSTICK ---
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');
const lensBtn = document.getElementById('lens-btn');
const magOverlay = document.getElementById('magnifier-overlay');

joystickZone.addEventListener('touchstart', (e) => {
  joystickActive = true;
  const touch = e.touches[0];
  const rect = joystickZone.getBoundingClientRect();
  joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
});

window.addEventListener('touchmove', (e) => {
  for (let i = 0; i < e.touches.length; i++) {
    const touch = e.touches[i];
    
    // Movimento Joystick
    if (joystickActive && touch.clientX < window.innerWidth / 2) {
      const dx = touch.clientX - joyStart.x;
      const dy = touch.clientY - joyStart.y;
      const dist = Math.min(Math.hypot(dx, dy), 40);
      const angle = Math.atan2(dy, dx);
      
      const knobX = Math.cos(angle) * dist;
      const knobY = Math.sin(angle) * dist;
      joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

      moveVector.x = knobX / 40;
      moveVector.y = knobY / 40;
    }
    
    // Rotazione Visuale (Parte destra dello schermo)
    if (isRotating && touch.clientX >= window.innerWidth / 2) {
      const deltaX = touch.clientX - previousTouch.x;
      const deltaY = touch.clientY - previousTouch.y;

      camera.rotation.y -= deltaX * rotationSensitivity;
      camera.rotation.x -= deltaY * rotationSensitivity;
      camera.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, camera.rotation.x));
      camera.rotation.z = 0;

      previousTouch = { x: touch.clientX, y: touch.clientY };
    }
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) {
    joystickActive = false;
    isRotating = false;
    joystickKnob.style.transform = `translate(0px, 0px)`;
    moveVector = { x: 0, y: 0 };
  }
});

// Avvio rotazione visuale
window.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  if (touch.clientX >= window.innerWidth / 2 && e.target !== lensBtn && e.target !== document.getElementById('napoli-banner')) {
    isRotating = true;
    previousTouch = { x: touch.clientX, y: touch.clientY };
    
    // Rimozione di 1 filo di fieno alla volta sul tap
    handleStrawRemoval(touch);
  }
});

// Attivazione Lente 4x
lensBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  isLensActive = !isLensActive;
  lensBtn.classList.toggle('active', isLensActive);
  magOverlay.style.display = isLensActive ? 'block' : 'none';
  camera.zoom = isLensActive ? 4 : 1;
  camera.updateProjectionMatrix();
});

// Rimozione un singolo filo di fieno vicinissimo al raggio del tocco
const raycaster = new THREE.Raycaster();
const touchVec = new THREE.Vector2();

function handleStrawRemoval(touch) {
  touchVec.x = (touch.clientX / window.innerWidth) * 2 - 1;
  touchVec.y = -(touch.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(touchVec, camera);
  const intersects = raycaster.intersectObject(strawMesh);

  if (intersects.length > 0) {
    const instanceId = intersects[0].instanceId;
    if (strawPositions[instanceId].active) {
      strawPositions[instanceId].active = false;
      
      // Nascondi il filo di fieno portando la scala della matrice a zero
      dummy.position.set(0, -500, 0);
      dummy.scale.set(0, 0, 0);
      dummy.updateMatrix();
      strawMesh.setMatrixAt(instanceId, dummy.matrix);
      strawMesh.instanceMatrix.needsUpdate = true;

      removedCount++;
      document.getElementById('count').innerText = removedCount;
    }
  }
}

// --- EVENTO 30 SECONDI ---
setInterval(() => {
  const banner = document.getElementById('napoli-banner');
  banner.style.display = 'block';
}, 30000);

document.getElementById('napoli-banner').addEventListener('click', () => {
  triggerVictory();
});

// --- AUDIO RILASSANTE SOTTOFONDO ---
function startRelaxingMusic() {
  Tone.start();
  const synth = new Tone.PolySynth(Tone.Synth).toDestination();
  synth.set({ volume: -12, envelope: { attack: 2, release: 3 } });
  
  const notes = ["C4", "E4", "G4", "B4", "C5"];
  let index = 0;
  
  Tone.Transport.scheduleRepeat((time) => {
    let note = notes[index % notes.length];
    synth.triggerAttackRelease(note, "2n", time);
    index++;
  }, "2m");

  Tone.Transport.start();
}

// --- VITTORIA: PALLONE SSC NAPOLI, FUOCHI E APPLAUSI ---
function triggerVictory() {
  document.getElementById('napoli-banner').style.display = 'none';
  
  // Applausi sintetizzati
  const noise = new Tone.Noise("brown").toDestination();
  noise.volume.value = -10;
  noise.start();
  setTimeout(() => noise.stop(), 5000);

  // Creazione Pallone Tridimensionale SSC Napoli
  const ballGeo = new THREE.SphereGeometry(1.5, 32, 32);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0x0080ff, roughness: 0.3, metalness: 0.1 });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(camera.position.x, camera.position.y + 0.5, camera.position.z - 4);
  scene.add(ball);

  // Fuochi d'artificio Azzurri (Particelle)
  const pGeo = new THREE.BufferGeometry();
  const pCount = 500;
  const posArray = new Float32Array(pCount * 3);
  for(let i=0; i<pCount*3; i++) {
    posArray[i] = (Math.random() - 0.5) * 8;
  }
  pGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  const pMat = new THREE.PointsMaterial({ size: 0.1, color: 0x00bfff });
  const fireworks = new THREE.Points(pGeo, pMat);
  fireworks.position.copy(ball.position);
  scene.add(fireworks);

  // Animazione Pallone
  function animateVictory() {
    requestAnimationFrame(animateVictory);
    ball.rotation.y += 0.02;
    fireworks.rotation.y -= 0.01;
    renderer.render(scene, camera);
  }
  animateVictory();
}

// Loop di rendering e movimento
function animate() {
  requestAnimationFrame(animate);

  if (moveVector.x !== 0 || moveVector.y !== 0) {
    const dir = new THREE.Vector3(moveVector.x, 0, moveVector.y).applyQuaternion(camera.quaternion);
    dir.y = 0;
    camera.position.addScaledVector(dir.normalize(), 0.08);
  }

  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Start
document.getElementById('start-btn').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  init3D();
  animate();
  startRelaxingMusic();
});
</script>
</body>
</html>
