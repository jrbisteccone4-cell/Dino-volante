<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Needle Horizon 3D</title>
  <style>
    * { box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    /* UI Overlay */
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: rgba(15, 23, 42, 0.9); color: #fff; text-align: center; padding: 20px; z-index: 100;
    }
    h1 { font-size: 2.2rem; margin-bottom: 10px; color: #f59e0b; text-shadow: 0 0 10px rgba(245,158,11,0.5); }
    p { font-size: 1rem; color: #cbd5e1; line-height: 1.5; max-width: 320px; margin-bottom: 25px; }
    .btn-start {
      padding: 16px 40px; font-size: 1.2rem; font-weight: bold; border: none;
      border-radius: 50px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white;
      box-shadow: 0 10px 25px rgba(245,158,11,0.4); cursor: pointer;
    }
    
    /* HUD durante il gioco */
    #hud { position: absolute; top: 15px; left: 15px; color: #fff; font-size: 1.1rem; font-weight: bold; text-shadow: 1px 1px 3px #000; z-index: 10; pointer-events: none; }
    #napoli-msg {
      position: absolute; top: 15px; right: 15px; background: rgba(239, 68, 68, 0.85); color: #fff;
      padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 0.9rem;
      display: none; animation: pulse 1.5s infinite; z-index: 20; box-shadow: 0 0 12px rgba(239,68,68,0.5);
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    
    /* Controlli Touch */
    #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; z-index: 20; }
    #joystick-base { width: 100%; height: 100%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; }
    #joystick-stick { width: 50px; height: 50px; background: #ffffff; border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 0 10px rgba(255,255,255,0.8); }
    
    #lens-btn {
      position: absolute; bottom: 40px; right: 30px; width: 75px; height: 75px;
      border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5);
      font-size: 2rem; display: flex; justify-content: center; align-items: center; z-index: 20;
      backdrop-filter: blur(4px); color: white;
    }
    #lens-btn.active { background: #f59e0b; border-color: #fff; box-shadow: 0 0 15px #f59e0b; }
  </style>

  <!-- Importazione Three.js per Grafica 3D Avanzata -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="overlay">
    <h1>NEEDLE HORIZON 3D</h1>
    <p>Trova l'ago nascosto nel vasto campo di fieno.<br><br>• Cursore bianco per muoverti<br>• Trascina lo schermo per girare la vista<br>• Tasto 🔎 per ingrandire (4x)<br>• Rimuovi i fili con un tocco!</p>
    <button class="btn-start" id="startBtn">INIZIA LA RICERCA</button>
  </div>

  <div id="hud">Fili rimossi: <span id="count">0</span></div>
  <div id="napoli-msg">sei un napolecanaccio</div>

  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-stick"></div>
    </div>
  </div>

  <button id="lens-btn">🔎</button>

  <script>
    // --- STATO E VARIABILI DI GIOCO ---
    let scene, camera, renderer, raycaster;
    let hayInstancedMesh, needleMesh;
    let removedCount = 0;
    const TOTAL_HAY = 1000000; // 1 Milione di fili gestiti tramite InstancedMesh
    let hayPositions = [];
    let needleIndex = -1;
    
    // Sensibilità e Camera
    let isLensActive = false;
    let cameraRotationY = 0;
    let cameraRotationX = 0;
    const mouseSensitivity = 0.0025; // Sensibilità bassa e fluida
    
    // Joystick
    let joyTouchId = null;
    let joyOrigin = { x: 0, y: 0 };
    let joyMove = { x: 0, y: 0 };
    
    // Touch per camera
    let lookTouchId = null;
    let lastLookPos = { x: 0, y: 0 };

    // --- INIZIALIZZAZIONE 3D ---
    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      raycaster = new THREE.Raycaster();

      // Luci
      const ambientLight = new THREE.AmbientLight(0xfffbeb, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5c0, 1.2);
      dirLight.position.set(50, 80, 50);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Terreno Campo Vasto
      const groundGeo = new THREE.PlaneGeometry(300, 300);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d1a04, roughness: 0.9 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // --- CREAZIONE 1 MILIONE DI FILI DI FIENO ---
      const hayGeo = new THREE.CylinderGeometry(0.008, 0.015, 0.4, 3);
      const hayMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.8 });
      hayInstancedMesh = new THREE.InstancedMesh(hayGeo, hayMat, TOTAL_HAY);

      const dummy = new THREE.Object3D();
      const fieldSize = 140; // Campo vasto per muoversi facilmente
      needleIndex = Math.floor(Math.random() * TOTAL_HAY);

      for (let i = 0; i < TOTAL_HAY; i++) {
        const x = (Math.random() - 0.5) * fieldSize;
        const z = (Math.random() - 0.5) * fieldSize;
        const y = 0.2;

        dummy.position.set(x, y, z);
        dummy.rotation.y = Math.random() * Math.PI;
        dummy.rotation.z = (Math.random() - 0.5) * 0.2;
        dummy.scale.set(1, 0.7 + Math.random() * 0.5, 1); // Fili bassi, fini e fitti
        dummy.updateMatrix();

        hayInstancedMesh.setMatrixAt(i, dummy.matrix);
        hayPositions.push({ x, y, z, active: true });

        // Posiziona l'Ago in corrispondenza del filo scelto
        if (i === needleIndex) {
          const needleGeo = new THREE.CylinderGeometry(0.003, 0.008, 0.35, 8);
          const needleMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.95, roughness: 0.1 });
          needleMesh = new THREE.Mesh(needleGeo, needleMat);
          needleMesh.position.set(x, y, z);
          needleMesh.rotation.z = Math.PI / 4;
          scene.add(needleMesh);
        }
      }
      scene.add(hayInstancedMesh);

      window.addEventListener('resize', onWindowResize);
    }

    // --- CONTROLLI E TOUCH ---
    const joyStickZone = document.getElementById('joystick-zone');
    const joyStickStick = document.getElementById('joystick-stick');
    const lensBtn = document.getElementById('lens-btn');

    // Listener Multitouch per Movimento + Visuale + Interazione
    window.addEventListener('touchstart', (e) => {
      for (let touch of e.changedTouches) {
        // Joystick (Parte sinistra dello schermo)
        if (touch.clientX < window.innerWidth / 2 && joyTouchId === null) {
          joyTouchId = touch.identifier;
          joyOrigin = { x: touch.clientX, y: touch.clientY };
        } 
        // Rotazione Vista & Selezione Filo (Parte destra dello schermo)
        else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
          lookTouchId = touch.identifier;
          lastLookPos = { x: touch.clientX, y: touch.clientY };
          checkHayClick(touch.clientX, touch.clientY);
        }
      }
    });

    window.addEventListener('touchmove', (e) => {
      for (let touch of e.changedTouches) {
        if (touch.identifier === joyTouchId) {
          let dx = touch.clientX - joyOrigin.x;
          let dy = touch.clientY - joyOrigin.y;
          let dist = Math.min(Math.hypot(dx, dy), 40);
          let angle = Math.atan2(dy, dx);
          
          joyMove.x = (Math.cos(angle) * dist) / 40;
          joyMove.y = (Math.sin(angle) * dist) / 40;

          joyStickStick.style.transform = `translate(${joyMove.x * 30}px, ${joyMove.y * 30}px)`;
        } else if (touch.identifier === lookTouchId) {
          let dx = touch.clientX - lastLookPos.x;
          let dy = touch.clientY - lastLookPos.y;

          cameraRotationY -= dx * mouseSensitivity;
          cameraRotationX -= dy * mouseSensitivity;
          cameraRotationX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotationX));

          lastLookPos = { x: touch.clientX, y: touch.clientY };
        }
      }
    });

    window.addEventListener('touchend', (e) => {
      for (let touch of e.changedTouches) {
        if (touch.identifier === joyTouchId) {
          joyTouchId = null;
          joyMove = { x: 0, y: 0 };
          joyStickStick.style.transform = `translate(0px, 0px)`;
        } else if (touch.identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    });

    // Lente di Ingrandimento 4x
    lensBtn.addEventListener('click', () => {
      isLensActive = !isLensActive;
      lensBtn.classList.toggle('active', isLensActive);
      camera.fov = isLensActive ? 15 : 60; // Zoom 4x
      camera.updateProjectionMatrix();
    });

    // Rimuovi 1 singolo filo alla volta
    function checkHayClick(clientX, clientY) {
      const mouse = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);

      // Controllo vittoria su Ago
      if (needleMesh) {
        const intersectsNeedle = raycaster.intersectObject(needleMesh);
        if (intersectsNeedle.length > 0) {
          triggerWin();
          return;
        }
      }

      // Rimozione singolo filo di fieno
      const intersectsHay = raycaster.intersectObject(hayInstancedMesh);
      if (intersectsHay.length > 0) {
        const instanceId = intersectsHay[0].instanceId;
        if (hayPositions[instanceId].active) {
          hayPositions[instanceId].active = false;
          const matrix = new THREE.Matrix4();
          matrix.setScale(0, 0, 0); // Nasconde il filo toccato
          hayInstancedMesh.setMatrixAt(instanceId, matrix);
          hayInstancedMesh.instanceMatrix.needsUpdate = true;

          removedCount++;
          document.getElementById('count').innerText = removedCount;
        }
      }
    }

    // --- GAME LOOP & MOVIMENTO ---
    function animate() {
      requestAnimationFrame(animate);

      // Aggiorna rotazione Camera
      camera.rotation.order = 'YXZ';
      camera.rotation.y = cameraRotationY;
      camera.rotation.x = cameraRotationX;

      // Movimento giocatore basato su direzione camera
      if (joyMove.x !== 0 || joyMove.y !== 0) {
        const speed = 0.08;
        const moveVector = new THREE.Vector3(joyMove.x, 0, joyMove.y);
        moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotationY);
        
        camera.position.x += moveVector.x * speed;
        camera.position.z += moveVector.z * speed;
      }

      renderer.render(scene, camera);
    }

    // --- MUSICA RILASSANTE (Web Audio API) ---
    function playRelaxingMusic() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [261.63, 293.66, 329.63, 392.00, 440.00]; // Scala pentatonica C4
      
      setInterval(() => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const freq = notes[Math.floor(Math.random() * notes.length)];
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 1);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 4);
      }, 2500);
    }

    // Timer Messaggio "sei un napolecanaccio" (Ogni 30s)
    function startTimer() {
      setInterval(() => {
        const msg = document.getElementById('napoli-msg');
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 5000);
      }, 30000);
    }

    // --- SCENA DI VITTORIA 3D (Pallone Napoli & Fuochi d'Artificio) ---
    function triggerWin() {
      scene.clear();
      scene.background = new THREE.Color(0x0284c7); // Sfondo Azzurro

      // Pallone 3D Napoli
      const ballGeo = new THREE.SphereGeometry(2, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({ color: 0x0080ff, roughness: 0.3, metalness: 0.2 });
      const ball = new THREE.Mesh(ballGeo, ballMat);
      ball.position.set(0, 2, -6);
      scene.add(ball);

      // Luce Vittoria
      const light = new THREE.PointLight(0xffffff, 2, 100);
      light.position.set(0, 5, 0);
      scene.add(light);

      // Fuochi d'Artificio Azzurri (Sistema di Particelle)
      const particleCount = 500;
      const pGeo = new THREE.BufferGeometry();
      const pPositions = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i++) {
        pPositions[i] = (Math.random() - 0.5) * 10;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.15 });
      const fireworks = new THREE.Points(pGeo, pMat);
      fireworks.position.set(0, 3, -6);
      scene.add(fireworks);

      // Effetto rotazione vittoria
      function winAnimate() {
        requestAnimationFrame(winAnimate);
        ball.rotation.y += 0.02;
        fireworks.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      winAnimate();

      // Messaggio Finale
      document.getElementById('hud').innerHTML = "<h1 style='color:#fff;'>HAI TROVATO L'AGO! VITTORIA! 🏆</h1>";
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Avvio del Gioco
    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('overlay').style.display = 'none';
      init3D();
      animate();
      playRelaxingMusic();
      startTimer();
    });
  </script>
</body>
</html>
