<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket Dungeon RPG</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #1f2833;
            padding-bottom: 10px;
        }
        h1 { margin: 0; color: #66fcf1; font-size: 1.4rem; }
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: #1f2833;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin: 10px 0;
        }
        .stats-panel div span { color: #45a29e; font-weight: bold; }
        #console {
            flex-grow: 1;
            background: #0b0c10;
            border: 1px solid #1f2833;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 200px;
            margin-bottom: 10px;
        }
        .log-msg { margin-bottom: 6px; }
        .log-player { color: #66fcf1; }
        .log-monster { color: #ff5555; }
        .log-loot { color: #f1c40f; }
        .actions-panel {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        button {
            background-color: #45a29e;
            color: #0b0c10;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:active { background-color: #66fcf1; }
        button:disabled { background-color: #1f2833; color: #555; cursor: not-allowed; }
        .btn-danger { background-color: #c0392b; color: #fff; }
        .btn-danger:active { background-color: #e74c3c; }
    </style>
</head>
<body>

    <header>
        <h1>⚔️ Pocket Dungeon</h1>
    </header>

    <div class="stats-panel">
        <div>Livello: <span id="lvl">1</span></div>
        <div>HP: <span id="hp">50</span>/<span id="maxHp">50</span></div>
        <div>Attacco: <span id="atk">10</span></div>
        <div>Oro: <span id="gold">0</span></div>
        <div>XP: <span id="xp">0</span>/<span id="maxXp">30</span></div>
        <div>Pozioni: <span id="potions">1</span></div>
    </div>

    <div id="console">
        <div class="log-msg">Benvenuto nel Dungeon, Eroe. Esplora per trovare tesori e combattere mostri!</div>
    </div>

    <div class="actions-panel" id="controls">
        <button id="btn-explore" onclick="explore()">🔍 Esplora</button>
        <button id="btn-potion" onclick="usePotion()">🧪 Pozione</button>
        <button id="btn-shop" onclick="openShop()">🛒 Negozio</button>
        <button class="btn-danger" onclick="resetGame()">🔄 Reset</button>
    </div>

    <script>
        let player = {
            lvl: 1,
            hp: 50,
            maxHp: 50,
            atk: 10,
            gold: 10,
            xp: 0,
            maxXp: 30,
            potions: 1
        };

        let currentMonster = null;
        let inCombat = false;

        const monsters = [
            { name: "Goblin", hp: 20, atk: 6, xp: 15, gold: 8 },
            { name: "Orco", hp: 35, atk: 10, xp: 25, gold: 15 },
            { name: "Scheletro", hp: 25, atk: 12, xp: 20, gold: 12 },
            { name: "Drago Infantile", hp: 60, atk: 18, xp: 50, gold: 40 }
        ];

        function log(text, type = "") {
            const consoleBox = document.getElementById("console");
            consoleBox.innerHTML += `<div class="log-msg ${type}">${text}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function updateUI() {
            document.getElementById("lvl").textContent = player.lvl;
            document.getElementById("hp").textContent = player.hp;
            document.getElementById("maxHp").textContent = player.maxHp;
            document.getElementById("atk").textContent = player.atk;
            document.getElementById("gold").textContent = player.gold;
            document.getElementById("xp").textContent = player.xp;
            document.getElementById("maxXp").textContent = player.maxXp;
            document.getElementById("potions").textContent = player.potions;
            saveGame();
        }

        function explore() {
            if (inCombat) return;

            const eventChance = Math.random();
            if (eventChance < 0.6) {
                // Incontro con un mostro
                const template = monsters[Math.floor(Math.random() * monsters.length)];
                currentMonster = { ...template };
                inCombat = true;
                log(`⚠️ Un ${currentNameOrCustom(currentMonster.name)} selvaggio appare! (HP: ${currentMonster.hp})`, "log-monster");
                setCombatControls();
            } else if (eventChance < 0.85) {
                // Trovato tesoro
                const foundGold = Math.floor(Math.random() * 15) + 5;
                player.gold += foundGold;
                log(`💰 Hai trovato un forziere con ${foundGold} monete d'oro!`, "log-loot");
            } else {
                // Pozione ritrovata
                player.potions++;
                log(`🧪 Hai trovato una pozione di cura nascosta tra le rocce!`, "log-loot");
            }
            updateUI();
        }

        function currentNameOrCustom(name) { return name; }

        function setCombatControls() {
            const panel = document.getElementById("controls");
            panel.innerHTML = `
                <button onclick="attackMonster()">⚔️ Attacca</button>
                <button onclick="usePotionInCombat()">🧪 Pozione</button>
            `;
        }

        function setDefaultControls() {
            const panel = document.getElementById("controls");
            panel.innerHTML = `
                <button id="btn-explore" onclick="explore()">🔍 Esplora</button>
                <button id="btn-potion" onclick="usePotion()">🧪 Pozione</button>
                <button id="btn-shop" onclick="openShop()">🛒 Negozio</button>
                <button class="btn-danger" onclick="resetGame()">🔄 Reset</button>
            `;
        }

        function attackMonster() {
            if (!inCombat) return;

            // Turno del giocatore
            currentMonster.hp -= player.atk;
            log(`Hai colpito il ${currentMonster.name} infliggendo ${player.atk} danni.`, "log-player");

            if (currentMonster.hp <= 0) {
                log(`🎉 Hai sconfitto il ${currentMonster.name}! Guadagni ${currentMonster.xp} XP e ${currentMonster.gold} oro.`, "log-loot");
                player.xp += currentMonster.xp;
                player.gold += currentMonster.gold;
                checkLevelUp();
                inCombat = false;
                currentMonster = null;
                setDefaultControls();
                updateUI();
                return;
            }

            // Turno del mostro
            player.hp -= currentMonster.atk;
            log(`Il ${currentMonster.name} ti attacca e ti infligge ${currentMonster.atk} danni.`, "log-monster");

            if (player.hp <=  0) {
                player.hp = 0;
                log(`💀 SEI MORTO! Il dungeon ti ha sconfitto.`, "log-monster");
                inCombat = false;
                setDefaultControls();
                updateUI();
                setTimeout(() => { resetGame(); }, 3000);
                return;
            }

            updateUI();
        }

        function usePotion() {
            if (player.potions > 0 && player.hp < player.maxHp) {
                player.potions--;
                player.hp = Math.min(player.maxHp, player.hp + 25);
                log(`🧪 Hai usato una pozione. HP ripristinati.`, "log-player");
                updateUI();
            } else {
                log(`Impossibile usare la pozione (senza scorte o HP al massimo).`);
            }
        }

        function usePotionInCombat() {
            if (player.potions > 0) {
                player.potions--;
                player.hp = Math.min(player.maxHp, player.hp + 25);
                log(`🧪 Hai bevuto una pozione durante il combattimento!`, "log-player");
                
                // Il mostro attacca comunque dopo la pozione
                player.hp -= currentMonster.atk;
                log(`Il ${currentMonster.name} approfitta della mossa e ti infligge ${currentMonster.atk} danni.`, "log-monster");
                
                if (player.hp <= 0) {
                    player.hp = 0;
                    log(`💀 SEI MORTO!`, "log-monster");
                    inCombat = false;
                    setDefaultControls();
                    setTimeout(() => { resetGame(); }, 3000);
                }
                updateUI();
            } else {
                log(`Non hai pozioni nello zaino!`);
            }
        }

        function checkLevelUp() {
            if (player.xp >= player.maxXp) {
                player.lvl++;
                player.xp -= player.maxXp;
                player.maxXp = Math.floor(player.maxXp * 1.5);
                player.maxHp += 15;
                player.hp = player.maxHp;
                player.atk += 4;
                log(`✨ LEVEL UP! Sei salito al livello ${player.lvl}! Statistiche potenziate.`, "log-loot");
            }
        }

        function openShop() {
            if (inCombat) return;
            if (player.gold >= 20) {
                player.gold -= 20;
                player.potions++;
                log(`🛒 Hai comprato una pozione al mercato nero per 20 monete.`, "log-loot");
                updateUI();
            } else {
                log(`Non hai abbastanza oro per comprare una pozione (Costa 20 oro).`);
            }
        }

        function saveGame() {
            localStorage.setItem('pocket_rpg', JSON.stringify(player));
        }

        function loadGame() {
            const saved = localStorage.getItem('pocket_rpg');
            if (saved) {
                player = JSON.parse(saved);
                log(`💾 Partita precedente caricata con successo.`);
                updateUI();
            }
        }

        function resetGame() {
            localStorage.removeItem('pocket_rpg');
            location.reload();
        }

        loadGame();
    </script>
</body>
</html>
